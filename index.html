<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Floating Island — 3D Low-Poly Diorama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #1a0f35 0%, #0b061d 60%, #05020e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Soft atmospheric vignette */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 45%, rgba(11, 6, 29, 0.4) 80%, rgba(6, 2, 16, 0.82) 100%);
    }

    /* Minimalist Loading Screen */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b061d;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 243, 255, 0.2);
      border-top-color: #00f3ff;
      border-right-color: #ff007f;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Import map for Three.js & Addons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-ring"></div>
  </div>

  <!-- 3D WebGL Canvas -->
  <div id="canvas-container"></div>
  <div class="vignette"></div>

  <!-- Main 3D Animation Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // Visible error banner
    window.addEventListener('error', (e) => {
      if (document.getElementById('err-banner')) return;
      const d = document.createElement('div');
      d.id = 'err-banner';
      d.textContent = 'JS error: ' + e.message;
      Object.assign(d.style, {
        position: 'fixed', left: '12px', bottom: '12px', zIndex: '200',
        background: '#7f1d1d', color: '#fff', padding: '8px 12px',
        font: '12px monospace', maxWidth: '60vw', borderRadius: '6px'
      });
      document.body.appendChild(d);
    });

    // ========================================================
    // 1. RENDERER, SCENE, FOG & ISOMETRIC CAMERA
    // ========================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // Atmospheric deep dark-purple fog (not pitch black!)
    scene.background = new THREE.Color(0x0b061d);
    scene.fog = new THREE.FogExp2(0x0b061d, 0.012);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(25, 17, 25);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.info.autoReset = false;
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;
    container.appendChild(renderer.domElement);

    // ========================================================
    // 1b. PROCEDURAL CYBERPUNK ENVMAP (PMREMGenerator)
    // ========================================================
    const pmremGen = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x06030e);

    const envPalette = [0xff007f, 0x00f3ff, 0xffaa00, 0xa855f7, 0x38bdf8, 0xff1744];
    for (let i = 0; i < 14; i++) {
      const angle = (i / 14) * Math.PI * 2;
      const radius = 25;
      const col = envPalette[i % envPalette.length];
      const gMat = new THREE.MeshBasicMaterial({ color: col });
      const w = 4 + Math.random() * 5;
      const h = 10 + Math.random() * 16;
      const gMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1), gMat);
      gMesh.position.set(Math.cos(angle) * radius, 6 + (Math.random() - 0.5) * 8, Math.sin(angle) * radius);
      gMesh.lookAt(0, 4, 0);
      envScene.add(gMesh);
    }
    const envRenderTarget = pmremGen.fromScene(envScene);
    const proceduralEnvMap = envRenderTarget.texture;
    pmremGen.dispose();

    // ========================================================
    // 1c. POST-PROCESSING (EffectComposer, MSAA Samples: 2, UnrealBloom & OutputPass)
    // ========================================================
    const composerRenderTarget = new THREE.WebGLRenderTarget(
      window.innerWidth,
      window.innerHeight,
      {
        type: THREE.HalfFloatType,
        samples: 2 // MSAA on render target
      }
    );

    const composer = new EffectComposer(renderer, composerRenderTarget);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    // UnrealBloomPass in half-resolution: threshold 0.4 keeps dark scene clean, pops neons
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(Math.floor(window.innerWidth / 2), Math.floor(window.innerHeight / 2)),
      0.65, // strength
      0.5, // radius
      0.4  // threshold
    );
    composer.addPass(bloomPass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    // Performance Watchdog: skip ~60 warmup frames, measure 3s, use median FPS (cutoff < 28)
    let useBloom = true;
    let fpsChecked = false;
    let warmupFrames = 0;
    const WARMUP_COUNT = 60;
    let fpsSamples = [];
    let fpsMeasureStartTime = 0;
    let lastFrameTime = performance.now();

    // Toggle bloom manually with 'B'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'b' || e.key === 'B' || e.key === 'и' || e.key === 'И') {
        useBloom = !useBloom;
        fpsChecked = true;
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (useBloom) {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          composer.setSize(w, h);
          bloomPass.resolution.set(Math.floor(w / 2), Math.floor(h / 2));
        } else {
          renderer.setPixelRatio(1);
          renderer.setSize(w, h);
        }
      }
    });

    // ========================================================
    // 1d. CINEMATIC PROCEDURAL CAMERA NAVIGATION & USER INPUT
    // ========================================================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false; // Controlled smoothly by cinematic system
    controls.minDistance = 12;
    controls.maxDistance = 48;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.target.set(0, 2.8, 0);

    let userInteracting = false;
    let lastUserActionTime = performance.now();
    let autoOrbitAngle = Math.atan2(camera.position.z, camera.position.x);
    let cinematicWeight = 1.0;

    controls.addEventListener('start', () => {
      userInteracting = true;
      lastUserActionTime = performance.now();
    });
    controls.addEventListener('end', () => {
      userInteracting = false;
      lastUserActionTime = performance.now();
      autoOrbitAngle = Math.atan2(camera.position.z, camera.position.x);
    });

    const onUserActivity = () => {
      lastUserActionTime = performance.now();
    };
    window.addEventListener('pointerdown', onUserActivity);
    window.addEventListener('wheel', onUserActivity, { passive: true });

    // Main Floating Island Master Group (levitates organically)
    const islandGroup = new THREE.Group();
    scene.add(islandGroup);

    // ========================================================
    // 1b. CRISP 3D HD NEON LIGHTBOX BUILDERS (1024x512 / 512x1024)
    // ========================================================
    function createHDNeonSignTexture({
      width = 1024,
      height = 512,
      text = '',
      color = '#00f3ff',
      glowColor = '#00f3ff',
      coreColor = '#ffffff',
      isVertical = false,
      fontSize = 210,
      border = true
    }) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // Deep dark acrylic diffuser backing
      ctx.fillStyle = '#06070e';
      ctx.fillRect(0, 0, width, height);

      // Dual-pass razor-sharp neon border frame
      if (border) {
        const strokeW = Math.max(6, Math.round(width / 140));
        ctx.strokeStyle = color;
        ctx.lineWidth = strokeW;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 32;
        ctx.strokeRect(20, 20, width - 40, height - 40);

        ctx.strokeStyle = coreColor;
        ctx.lineWidth = Math.max(2, Math.round(strokeW / 3));
        ctx.shadowBlur = 8;
        ctx.strokeRect(20, 20, width - 40, height - 40);
      }

      // Authentic Japanese Sans-Serif Typography: Meiryo & Segoe UI
      const fontFam = '"Segoe UI", Meiryo, "Hiragino Sans", "Yu Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (isVertical) {
        const chars = Array.from(text);
        const lineSpacing = (height - 60) / chars.length;
        const startY = 30 + lineSpacing / 2;

        ctx.font = `bold ${fontSize}px ${fontFam}`;

        // Pass 1: Broad diffuse outer neon bloom
        ctx.fillStyle = color;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 40;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });

        // Pass 2: Intense inner neon glow
        ctx.fillStyle = color;
        ctx.shadowBlur = 18;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });

        // Pass 3: Brilliant white core
        ctx.fillStyle = coreColor;
        ctx.shadowBlur = 6;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });
      } else {
        const centerY = height * 0.5;
        ctx.font = `bold ${fontSize}px ${fontFam}`;

        // Pass 1: Broad diffuse outer neon bloom
        ctx.fillStyle = color;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 44;
        ctx.fillText(text, width / 2, centerY);

        // Pass 2: Medium concentrated glow
        ctx.fillStyle = color;
        ctx.shadowBlur = 20;
        ctx.fillText(text, width / 2, centerY);

        // Pass 3: Razor white hot core
        ctx.fillStyle = coreColor;
        ctx.shadowBlur = 6;
        ctx.fillText(text, width / 2, centerY);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      return texture;
    }

    // Real 3D Physical Lightbox with deep metal chassis, raised beveled frame & mounting brackets
    function create3DLightboxMesh({
      w = 2.8,
      h = 1.3,
      d = 0.22,
      texture,
      doubleSided = false,
      bracketType = 'wall' // 'wall', 'roof', 'hanging'
    }) {
      const group = new THREE.Group();

      const chassisMat = new THREE.MeshStandardMaterial({
        color: 0x0c0e14,
        roughness: 0.38,
        metalness: 0.72
      });
      const bracketMat = new THREE.MeshStandardMaterial({
        color: 0x161a24,
        roughness: 0.45,
        metalness: 0.8
      });

      // 1. Deep Metallic Enclosure Box (Chassis)
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), chassisMat);
      chassis.castShadow = true;
      group.add(chassis);

      // 2. Raised Outer Bezel Rim (Frames the glowing acrylic face)
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0x1a1e2b,
        roughness: 0.3,
        metalness: 0.85
      });
      const topRim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.04, d + 0.02), rimMat);
      topRim.position.y = h / 2 + 0.02;
      group.add(topRim);

      const botRim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.04, d + 0.02), rimMat);
      botRim.position.y = -h / 2 - 0.02;
      group.add(botRim);

      const leftRim = new THREE.Mesh(new THREE.BoxGeometry(0.04, h + 0.08, d + 0.02), rimMat);
      leftRim.position.x = -w / 2 - 0.02;
      group.add(leftRim);

      const rightRim = new THREE.Mesh(new THREE.BoxGeometry(0.04, h + 0.08, d + 0.02), rimMat);
      rightRim.position.x = w / 2 + 0.02;
      group.add(rightRim);

      // 3. Glowing Acrylic Neon Face (Recessed inside the bezel)
      const faceGeo = new THREE.PlaneGeometry(w - 0.02, h - 0.02);
      const faceMat = new THREE.MeshBasicMaterial({
        map: texture,
        toneMapped: false
      });

      const frontFace = new THREE.Mesh(faceGeo, faceMat);
      frontFace.position.z = d / 2 + 0.006;
      group.add(frontFace);

      group.userData.faceMat = faceMat;
      group.userData.frontFace = frontFace;

      if (doubleSided) {
        const backFace = new THREE.Mesh(faceGeo, faceMat);
        backFace.position.z = -d / 2 - 0.006;
        backFace.rotation.y = Math.PI;
        group.add(backFace);
        group.userData.backFace = backFace;
      }

      // 4. Heavy Industrial Mounting Brackets
      if (bracketType === 'wall') {
        [-h * 0.35, h * 0.35].forEach(yB => {
          const arm = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.07, 0.07), bracketMat);
          arm.position.set(-w / 2 - 0.19, yB, 0);
          group.add(arm);

          const flange = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.2, 0.2), bracketMat);
          flange.position.set(-w / 2 - 0.38, yB, 0);
          group.add(flange);
        });
      } else if (bracketType === 'roof') {
        [-w * 0.38, w * 0.38].forEach(xB => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.85, 8), bracketMat);
          leg.position.set(xB, -h / 2 - 0.42, 0);
          group.add(leg);

          const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.1, 6), bracketMat);
          strut.position.set(xB, -h / 4 - 0.3, -0.42);
          strut.rotation.x = -0.7;
          group.add(strut);
        });
      } else if (bracketType === 'hanging') {
        [-w * 0.36, w * 0.36].forEach(xB => {
          const hanger = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.38, 0.1), bracketMat);
          hanger.position.set(xB, h / 2 + 0.19, 0);
          group.add(hanger);
        });
      }

      return group;
    }

    // ========================================================
    // 2. MATERIALS PALETTE (Balanced Metalness for Wet Sheen)
    // ========================================================
    // Important: metalness kept around 0.25 - 0.3 so surfaces don't black out without envMap!
    const MAT = {
      // Wet Asphalt: low roughness (0.12) + moderate metalness (0.28) + PMREM envMap reflections
      asphaltWet: new THREE.MeshStandardMaterial({
        color: 0x1a1f30,
        roughness: 0.12,
        metalness: 0.28,
        envMap: proceduralEnvMap,
        envMapIntensity: 0.5
      }),
      // Sidewalk concrete
      sidewalk: new THREE.MeshStandardMaterial({
        color: 0x333e56,
        roughness: 0.45,
        metalness: 0.15
      }),
      // Road Markings (Yellow & White)
      roadYellow: new THREE.MeshStandardMaterial({
        color: 0xffaa00,
        emissive: 0xff9900,
        emissiveIntensity: 0.6,
        roughness: 0.2
      }),
      roadWhite: new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        roughness: 0.25
      }),
      // Wet Roof Tiles
      roofTile: new THREE.MeshStandardMaterial({
        color: 0x1e2438,
        roughness: 0.14,
        metalness: 0.3
      }),
      // Cyber timber / dark frames
      timberDark: new THREE.MeshStandardMaterial({
        color: 0x161a26,
        roughness: 0.5,
        metalness: 0.2
      }),
      // Traditional vermilion red accents
      cyberRed: new THREE.MeshStandardMaterial({
        color: 0xd92626,
        roughness: 0.35,
        metalness: 0.2
      }),
      // Glowing Window Lattices & Screens
      windowWarm: new THREE.MeshStandardMaterial({
        color: 0xffbe0b,
        emissive: 0xffa000,
        emissiveIntensity: 1.1,
        roughness: 0.2
      }),
      windowCyan: new THREE.MeshStandardMaterial({
        color: 0x00f3ff,
        emissive: 0x00f3ff,
        emissiveIntensity: 1.1,
        roughness: 0.2
      }),
      // Vibrant Neon Materials (MeshBasicMaterial for pure luminous pop)
      neonPink: new THREE.MeshBasicMaterial({
        color: 0xff007f
      }),
      neonCyan: new THREE.MeshBasicMaterial({
        color: 0x00f3ff
      }),
      neonPurple: new THREE.MeshBasicMaterial({
        color: 0xb5179e
      }),
      neonAmber: new THREE.MeshBasicMaterial({
        color: 0xffaa00
      }),
      // Sakura tree foliage (multitiered semi-transparent glowing pink/magenta clusters)
      sakuraLeaves: new THREE.MeshStandardMaterial({
        color: 0xff69b4,
        emissive: 0xff1493,
        emissiveIntensity: 0.5,
        roughness: 0.35,
        transparent: true,
        opacity: 0.88
      }),
      sakuraTrunk: new THREE.MeshStandardMaterial({
        color: 0x24151b,
        roughness: 0.85
      }),
      // Floating island rock / voxel dirt underbelly
      rockDark: new THREE.MeshStandardMaterial({
        color: 0x181c2b,
        roughness: 0.88,
        metalness: 0.15
      }),
      rockAccent: new THREE.MeshStandardMaterial({
        color: 0x23293d,
        roughness: 0.82,
        metalness: 0.2
      }),
      // Metallic pipes and structural girders
      metalPipe: new THREE.MeshStandardMaterial({
        color: 0x475569,
        roughness: 0.35,
        metalness: 0.6
      }),
      metalRust: new THREE.MeshStandardMaterial({
        color: 0x854d0e,
        roughness: 0.55,
        metalness: 0.4
      })
    };

    // ========================================================
    // 3. ENHANCED LIGHTING (Hemisphere + Directional + PointLights)
    // ========================================================
    // 1. Hemisphere Light: violet sky & cyan ground for crisp edge definition
    const hemiLight = new THREE.HemisphereLight(0x8866ff, 0x00d2ff, 1.5);
    scene.add(hemiLight);

    // 2. Directional Key Light with soft shadows
    const dirLight = new THREE.DirectionalLight(0xd8b4fe, 1.3);
    dirLight.position.set(15, 26, 12);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 65;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    dirLight.shadow.bias = -0.001;
    scene.add(dirLight);

    // 3. Strategic Colored PointLights for vibrant specular pools on wet asphalt:
    // Warm Golden-Orange Light from the Ramen Bar (placed inside hollow stall interior)
    const ramenWarmLight = new THREE.PointLight(0xff9500, 4.6, 14, 1.7);
    ramenWarmLight.position.set(-4.8, 2.05, -1.1);
    islandGroup.add(ramenWarmLight);

    // Hot Pink Light from Pagoda & Signs
    const neonPinkLight = new THREE.PointLight(0xff007f, 4.2, 15, 1.8);
    neonPinkLight.position.set(-3.8, 3.8, 1.6);
    islandGroup.add(neonPinkLight);

    // Electric Cyan / Turquoise Light from Hotel & Vending Machines
    const neonCyanLight = new THREE.PointLight(0x00f3ff, 4.2, 15, 1.7);
    neonCyanLight.position.set(3.8, 3.2, -2.2);
    islandGroup.add(neonCyanLight);

    // Lush Pink Glow right inside the Sakura Tree Canopy
    const sakuraPinkLight = new THREE.PointLight(0xff1493, 4.0, 13, 1.8);
    sakuraPinkLight.position.set(4.6, 3.2, 2.8);
    islandGroup.add(sakuraPinkLight);

    // Deep Violet Light from Hotel Signboard
    const hotelPurpleLight = new THREE.PointLight(0xaa00ff, 3.5, 12, 1.8);
    hotelPurpleLight.position.set(4.2, 5.2, -1.0);
    islandGroup.add(hotelPurpleLight);

    // Streetlamp Cyan Spotlight
    const streetLampLight = new THREE.PointLight(0x38bdf8, 3.2, 12, 1.6);
    streetLampLight.position.set(3.4, 4.4, 4.0);
    islandGroup.add(streetLampLight);

    // Soft Violet-Blue Void Under-Island Light (emphasizes island levitating in air)
    const underIslandLight = new THREE.PointLight(0x6366f1, 5.5, 26, 1.8);
    underIslandLight.position.set(0, -8.5, 0);
    islandGroup.add(underIslandLight);

    const underIslandVoidGlow = new THREE.PointLight(0x7c3aed, 4.0, 20, 1.6);
    underIslandVoidGlow.position.set(0, -12.0, 0);
    islandGroup.add(underIslandVoidGlow);

    // ========================================================
    // 4. FLOATING ISLAND PLATFORM & UNDERBELLY (Voxel/Rock Depth)
    // ========================================================
    const platformW = 15;
    const platformD = 15;
    const platformH = 1.2;

    // Wet Asphalt Surface Deck
    const deckGeo = new THREE.BoxGeometry(platformW, platformH, platformD);
    const deckMesh = new THREE.Mesh(deckGeo, MAT.asphaltWet);
    deckMesh.position.y = -platformH / 2;
    deckMesh.receiveShadow = true;
    islandGroup.add(deckMesh);

    // Sidewalk Raised Platforms (Left & Right)
    const swGeoL = new THREE.BoxGeometry(4.6, 0.25, platformD - 0.2);
    const swMeshL = new THREE.Mesh(swGeoL, MAT.sidewalk);
    swMeshL.position.set(-5.2, 0.12, 0);
    swMeshL.receiveShadow = true;
    swMeshL.castShadow = true;
    islandGroup.add(swMeshL);

    const swGeoR = new THREE.BoxGeometry(4.6, 0.25, platformD - 0.2);
    const swMeshR = new THREE.Mesh(swGeoR, MAT.sidewalk);
    swMeshR.position.set(5.2, 0.12, 0);
    swMeshR.receiveShadow = true;
    swMeshR.castShadow = true;
    islandGroup.add(swMeshR);

    // Double Yellow Center Road Markings
    const yLineGeo = new THREE.BoxGeometry(0.12, 0.02, platformD - 0.6);
    const yLine1 = new THREE.Mesh(yLineGeo, MAT.roadYellow);
    yLine1.position.set(-0.12, 0.01, 0);
    islandGroup.add(yLine1);

    const yLine2 = new THREE.Mesh(yLineGeo, MAT.roadYellow);

    function limb(radius, length, mat) {
      const pivot = new THREE.Group();
      const geo = new THREE.CapsuleGeometry(radius, length, 4, 8);
      geo.translate(0, -(length / 2 + radius), 0); // верх капсулы в точке сустава
      pivot.add(new THREE.Mesh(geo, mat));
      pivot.userData.total = length + radius * 2;
      return pivot;
    }

    function createCitizen({
      coat = 0x141824,
      trim = 0x00f3ff,
      sitting = false,
      longCoat = false,
      hood = true,
      visor = true,
      headband = false,
      apron = false,
      eating = false,
      phase = Math.random() * 6
    } = {}) {
      const g = new THREE.Group();
      const coatMat = new THREE.MeshStandardMaterial({ color: coat, roughness: 0.75, metalness: 0.1 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x07080c, roughness: 0.9 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x9c7a68, roughness: 0.8 });
      const glowMat = new THREE.MeshBasicMaterial({ color: trim, toneMapped: false });

      const hipY = sitting ? 0.59 : 0.76;

      // Торс (слегка приплюснут по Z)
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.28, 4, 10), coatMat);
      torso.scale.set(1, 1, 0.72);
      torso.position.y = hipY + 0.28;
      torso.castShadow = true;
      g.add(torso);

      // Неоновая полоса на спине
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.38, 0.02), glowMat);
      stripe.position.set(0, hipY + 0.3, -0.115);
      g.add(stripe);

      if (longCoat && !sitting) {
        const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.26, 0.5, 12), coatMat);
        skirt.scale.set(1, 1, 0.8);
        skirt.position.y = hipY - 0.08;
        g.add(skirt);
      }

      if (apron) {
        const ap = new THREE.Mesh(
          new THREE.BoxGeometry(0.26, 0.42, 0.02),
          new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.9 })
        );
        ap.position.set(0, hipY + 0.2, 0.115);
        g.add(ap);
      }

      // Голова
      const head = new THREE.Group();
      head.position.y = hipY + 0.7;
      g.add(head);

      if (hood) {
        const hd = new THREE.Mesh(new THREE.SphereGeometry(0.135, 14, 10), coatMat);
        hd.scale.set(1, 1.05, 1.05);
        hd.position.z = -0.02;
        head.add(hd);
        const face = new THREE.Mesh(new THREE.SphereGeometry(0.105, 12, 8), darkMat);
        face.position.z = 0.045;
        head.add(face);
      } else {
        const hd = new THREE.Mesh(new THREE.SphereGeometry(0.115, 14, 10), skinMat);
        head.add(hd);
        const hair = new THREE.Mesh(
          new THREE.SphereGeometry(0.125, 14, 8, 0, Math.PI * 2, 0, Math.PI / 1.9),
          darkMat
        );
        hair.position.set(0, 0.01, -0.01);
        head.add(hair);
        [-0.04, 0.04].forEach((ex) => {
          const eye = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 0.01), darkMat);
          eye.position.set(ex, 0.0, 0.112);
          head.add(eye);
        });
      }

      if (visor) {
        const v = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.04, 0.04), glowMat);
        v.position.set(0, 0.01, 0.14);
        head.add(v);
      }

      if (headband) {
        const band = new THREE.Mesh(
          new THREE.TorusGeometry(0.122, 0.014, 6, 16),
          new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.8 })
        );
        band.rotation.x = Math.PI / 2;
        band.position.y = 0.045;
        head.add(band);
      }

      // Руки: плечо -> предплечье
      const makeArm = (side) => {
        const upper = limb(0.045, 0.2, coatMat);
        upper.position.set(side * 0.2, hipY + 0.5, 0);
        const fore = limb(0.04, 0.2, coatMat);
        fore.position.y = -upper.userData.total;
        upper.add(fore);
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), skinMat);
        hand.position.y = -fore.userData.total;
        fore.add(hand);
        g.add(upper);
        return { upper, fore };
      };
      const armL = makeArm(-1);
      const armR = makeArm(1);

      // Ноги
      const makeLeg = (side) => {
        const thigh = limb(0.065, 0.24, coatMat);
        thigh.position.set(side * 0.085, hipY, 0);
        const shin = limb(0.055, 0.24, darkMat);
        shin.position.y = -thigh.userData.total;
        thigh.add(shin);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 0.17), darkMat);
        foot.position.set(0, -shin.userData.total + 0.01, 0.04);
        shin.add(foot);
        g.add(thigh);
        return { thigh, shin };
      };
      const legL = makeLeg(-1);
      const legR = makeLeg(1);

      let chopsticks = null;

      if (sitting) {
        // Сидит: бёдра вперёд, голени вниз
        [legL, legR].forEach((l) => {
          l.thigh.rotation.x = -Math.PI / 2;
          l.shin.rotation.x = Math.PI / 2;
        });
        // Левая рука на стойке, правая с палочками к миске
        armL.upper.rotation.x = -0.5;
        armL.fore.rotation.x = -0.9;
        armR.upper.rotation.x = -0.7;
        armR.fore.rotation.x = -1.3;

        if (eating) {
          chopsticks = new THREE.Mesh(
            new THREE.CylinderGeometry(0.006, 0.006, 0.24, 4),
            new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.6 })
          );
          chopsticks.geometry.translate(0, -0.12, 0);
          chopsticks.position.y = -armR.fore.userData.total;
          chopsticks.rotation.x = 1.2;
          armR.fore.add(chopsticks);
        }
      } else {
        armL.upper.rotation.z = 0.08;
        armR.upper.rotation.z = -0.08;
        armL.fore.rotation.x = -0.25;
        armR.fore.rotation.x = -0.25;
      }

      // Лёгкая «жизнь»: дыхание, повороты головы, подъём палочек
      g.userData.update = (t) => {
        torso.scale.y = 1 + Math.sin(t * 1.6 + phase) * 0.015;
        head.rotation.y = Math.sin(t * 0.4 + phase) * 0.15;
        head.rotation.x = Math.sin(t * 0.55 + phase) * 0.04;
        if (sitting && eating) {
          const lift = Math.pow(Math.max(0, Math.sin(t * 1.2 + phase)), 2);
          armR.fore.rotation.x = -1.3 + lift * 0.45;
        }
      };

      g.userData.hipY = hipY;
      g.userData.stripe = stripe;

      return g;
    }

    function createEmblemTexture(glyph, color) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0a0a0f';
      ctx.beginPath();
      ctx.arc(64, 64, 58, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(64, 64, 54, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 76px "Yu Gothic", Meiryo, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(glyph, 64, 70);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    // Helper: Dark Cyber Window Grille / Mullions
    function addWindowGrille(parent, w, h, x, y, z, rotY = 0) {
      const gGroup = new THREE.Group();
      gGroup.position.set(x, y, z);
      gGroup.rotation.y = rotY;
      const frameMat = MAT.timberDark;
      const t = 0.04;
      const d = 0.025;
      const top = new THREE.Mesh(new THREE.BoxGeometry(w, t, d), frameMat);
      top.position.y = h / 2;
      const bot = new THREE.Mesh(new THREE.BoxGeometry(w, t, d), frameMat);
      bot.position.y = -h / 2;
      const left = new THREE.Mesh(new THREE.BoxGeometry(t, h, d), frameMat);
      left.position.x = -w / 2;
      const right = new THREE.Mesh(new THREE.BoxGeometry(t, h, d), frameMat);
      right.position.x = w / 2;
      gGroup.add(top, bot, left, right);
      for (let i = 1; i <= 3; i++) {
        const sx = -w / 2 + (w / 4) * i;
        const vSlat = new THREE.Mesh(new THREE.BoxGeometry(0.025, h, d), frameMat);
        vSlat.position.x = sx;
        gGroup.add(vSlat);
      }
      const hSlat = new THREE.Mesh(new THREE.BoxGeometry(w, 0.025, d), frameMat);
      gGroup.add(hSlat);
      parent.add(gGroup);
    }

    function buildRamenStall(pg) {
      const wall = MAT.timberDark;
      const inner = new THREE.MeshStandardMaterial({ color: 0x3a2a22, roughness: 0.8 });
      const wood = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.55 });
      const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
      const add = (geo, mat, x, y, z, cast = false) => {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.castShadow = cast;
        m.receiveShadow = true;
        pg.add(m);
        return m;
      };

      // Корпус: задняя масса + полая передняя часть (глубина z от 0.4 до 2.2)
      add(B(4.4, 2.5, 2.6), wall, 0, 1.25, -0.9, true);
      add(B(0.2, 2.5, 1.8), wall, -2.1, 1.25, 1.3, true);
      add(B(0.2, 2.5, 1.8), wall, 2.1, 1.25, 1.3, true);
      add(B(4.4, 0.25, 1.8), wall, 0, 2.375, 1.3, true);   // потолок
      add(B(4.0, 0.06, 1.8), wood, 0, 0.03, 1.3);          // пол

    function createFogBankTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(0.5, 'rgba(255,255,255,0.35)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const cloudsGroup = new THREE.Group();
    const fogTex = createFogBankTexture();
    const fogTints = [0x4c1d95, 0x831843, 0x155e75, 0x3730a3];

      const mat = new THREE.SpriteMaterial({

        color: fogTints[i % fogTints.length],

      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.3, 'rgba(0,0,0,0)');
      grad.addColorStop(0.75, colorHex);
      grad.addColorStop(1.0, '#ffffff');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 32);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;

        const wing = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.04, 0.22), bodyMat);
        wing.position.set(-0.15, -0.02, z);
        speederGroup.add(wing);
      });

      // Front Headlights
      [-0.16, 0.16].forEach(z => {
        const hl = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 8, 8),
          new THREE.MeshBasicMaterial({ color: headlightColor, toneMapped: false })
        );
        hl.position.set(1.0, 0, z);
        speederGroup.add(hl);
      });

      // Rear Engine Thrusters
      [-0.18, 0.18].forEach(z => {
        const tl = new THREE.Mesh(
          new THREE.BoxGeometry(0.06, 0.1, 0.12),
          new THREE.MeshBasicMaterial({ color: lightColorNum, toneMapped: false })
        );
        tl.position.set(-0.72, 0.02, z);
        speederGroup.add(tl);
      });

      // Neon Light Trails (Horizontal & Vertical Cross-Ribbons for 360° visibility)
      const trailTex = createNeonTrailTexture(lightColorHex);
      const trailMat = new THREE.MeshBasicMaterial({
        map: trailTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false,
        toneMapped: false
      });

      [-0.18, 0.18].forEach(z => {
        const trailHGeo = new THREE.PlaneGeometry(trailLength, 0.08);
        const trailH = new THREE.Mesh(trailHGeo, trailMat);
        trailH.rotation.x = Math.PI / 2;
        trailH.position.set(-0.72 - trailLength / 2, 0.02, z);
        speederGroup.add(trailH);

        const trailVGeo = new THREE.PlaneGeometry(trailLength, 0.08);
        const trailV = new THREE.Mesh(trailVGeo, trailMat);
        trailV.position.set(-0.72 - trailLength / 2, 0.02, z);
        speederGroup.add(trailV);
      });

      return speederGroup;
    }

    // Speeder 1: Lower corridor, travels along +X with scarlet neon light trails
    const speeder1 = createFlyingSpeeder({
      bodyColor: 0x161a24,
      lightColorHex: '#ff1a35',
      lightColorNum: 0xff1a35,
      headlightColor: 0x38bdf8,
      trailLength: 6.5
    });
    speeder1.position.set(-15, 6.0, -15.0);
    scene.add(speeder1);

    // Speeder 2: Higher corridor, travels along -X with electric cyan neon light trails
    const speeder2 = createFlyingSpeeder({
      bodyColor: 0x181e2b,
      lightColorHex: '#00f3ff',
      lightColorNum: 0x00f3ff,
      headlightColor: 0xffd166,
      trailLength: 7.2
    });
    speeder2.rotation.y = Math.PI; // Face -X direction
    speeder2.position.set(12, 8.8, -18.5);
    scene.add(speeder2);

    const speeder3 = createFlyingSpeeder({
      bodyColor: 0x1b1f2e, lightColorHex: '#b026ff', lightColorNum: 0xb026ff,
      headlightColor: 0xffffff, trailLength: 8.5
    });
    speeder3.scale.setScalar(1.35);
    speeder3.position.set(-40, 4.2, -24);
    scene.add(speeder3);

    // ============================================================
    // ПАТЧ 9 — ЗВУК: ГРОМ + МОЛНИЯ, ГУЛ ДРОНОВ, ТРЕСК НЕОНА, ШИПЕНИЕ, СВИСТ СПИДЕРОВ
    // ============================================================
    let audioExtras = null;
    let audioCtx = null;
    let masterGain = null;
    let audioOn = false;
    let nextThunderAt = 6;
    let lightningFlash = 0;
    let lightningStart = -10;
    const HEMI_BASE = hemiLight.intensity;
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const _camDir = new THREE.Vector3();

    function makeNoiseBuffer(ctx, seconds) {
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }

    function setPannerPos(p, x, y, z) {
      if (p.positionX) {
        p.positionX.value = x;
        p.positionY.value = y;
        p.positionZ.value = z;
      } else {
        p.setPosition(x, y, z);
      }
    }

    function makePanner(ctx, x, y, z, refDistance) {
      const p = ctx.createPanner();
      p.panningModel = 'equalpower';
      p.distanceModel = 'inverse';
      p.refDistance = refDistance;
      p.rolloffFactor = 1.1;
      setPannerPos(p, x, y, z);
      return p;
    }

    function buildAudioExtras() {
      const ctx = audioCtx;
      const noise = makeNoiseBuffer(ctx, 3);
      audioExtras = { noise, drones: [], speeders: [] };

      // Гул дронов: тихая пила через фильтр, источник едет вместе с дроном
      [drone1, drone2].forEach((d, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = 210 + i * 23;
        const whine = ctx.createOscillator();
        whine.type = 'sine';
        whine.frequency.value = 1150 + i * 110;
        const whineGain = ctx.createGain();
        whineGain.gain.value = 0.015;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 900;
        const g = ctx.createGain();
        g.gain.value = 0.14;
        const p = makePanner(ctx, 0, 3, 0, 8);
        p.rolloffFactor = 0.7;
        osc.connect(lp);
        whine.connect(whineGain);
        whineGain.connect(lp);
        lp.connect(g);
        g.connect(p);
        p.connect(masterGain);
        osc.start();
        whine.start();
        audioExtras.drones.push({ obj: d, panner: p });
      });

      // Свист спидеров: полосовой шум, громкость растёт, когда спидер пролетает мимо острова
      [speeder1, speeder2, speeder3].forEach((s, i) => {
        const src = ctx.createBufferSource();
        src.buffer = noise;
        src.loop = true;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 700 + i * 300;
        bp.Q.value = 0.7;
        const g = ctx.createGain();
        g.gain.value = 0;
        const p = makePanner(ctx, 0, 0, 0, 8);
        src.connect(bp);
        bp.connect(g);
        g.connect(p);
        p.connect(masterGain);
        src.start();
        audioExtras.speeders.push({ obj: s, gain: g, panner: p });
      });

      // Электрический гул вывесок («ラーメン» и «荒坂»), слегка «дышит»
      const hum = ctx.createOscillator();
      hum.type = 'sawtooth';
      hum.frequency.value = 100;
      const humLp = ctx.createBiquadFilter();
      humLp.type = 'lowpass';
      humLp.frequency.value = 280;
      const humGain = ctx.createGain();
      humGain.gain.value = 0.012;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 6.3;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.006;
      lfo.connect(lfoGain);
      lfoGain.connect(humGain.gain);
      hum.connect(humLp);
      humLp.connect(humGain);
      [[-4.8, 2.8, -0.2], [4.8, 6.4, -1.4]].forEach(([x, y, z]) => {
        const p = makePanner(ctx, x, y, z, 3);
        humGain.connect(p);
        p.connect(masterGain);
      });
      hum.start();
      lfo.start();

      // Шипение у лапшичной: высокочастотный шум с пульсацией
      const sz = ctx.createBufferSource();
      sz.buffer = noise;
      sz.loop = true;
      const szBp = ctx.createBiquadFilter();
      szBp.type = 'bandpass';
      szBp.frequency.value = 5200;
      szBp.Q.value = 0.8;
      const szGain = ctx.createGain();
      szGain.gain.value = 0.02;
      const szLfo = ctx.createOscillator();
      szLfo.frequency.value = 3.1;
      const szLfoGain = ctx.createGain();
      szLfoGain.gain.value = 0.012;
      szLfo.connect(szLfoGain);
      szLfoGain.connect(szGain.gain);
      const szPan = makePanner(ctx, -4.8, 1.2, -0.6, 2.5);
      sz.connect(szBp);
      szBp.connect(szGain);
      szGain.connect(szPan);
      szPan.connect(masterGain);
      sz.start();
      szLfo.start();
    }

    function playThunder() {
      if (!audioCtx || !audioOn || !audioExtras) return;
      const ctx = audioCtx;
      const now = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = audioExtras.noise;
      src.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(900, now);
      lp.frequency.exponentialRampToValueAtTime(70, now + 3.2);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.55, now + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + 4.0);
      src.connect(lp);
      lp.connect(g);
      g.connect(masterGain);
      src.start(now, Math.random() * 1.5, 4.2);
    }

    function updateLightning(time, delta) {
      if (time > nextThunderAt) {
        nextThunderAt = time + 14 + Math.random() * 22;
        if (!REDUCED_MOTION) lightningStart = time;
        setTimeout(playThunder, 500 + Math.random() * 1500);
      }
      const age = time - lightningStart;
      let flash = 0;
      if (age >= 0 && age < 2) {
        flash = Math.exp(-age * 4.5) + (age > 0.25 ? 0.7 * Math.exp(-(age - 0.25) * 4.5) : 0);
      }
      hemiLight.intensity = HEMI_BASE + flash * 2.4;
    }

    function updateAudio3D(cam) {
      if (!audioCtx || !audioExtras) return;
      const L = audioCtx.listener;
      const p = cam.position;
      cam.getWorldDirection(_camDir);
      if (L.positionX) {
        L.positionX.value = p.x;
        L.positionY.value = p.y;
        L.positionZ.value = p.z;
        L.forwardX.value = _camDir.x;
        L.forwardY.value = _camDir.y;
        L.forwardZ.value = _camDir.z;
        L.upX.value = 0;
        L.upY.value = 1;
        L.upZ.value = 0;
      } else {
        L.setPosition(p.x, p.y, p.z);
        L.setOrientation(_camDir.x, _camDir.y, _camDir.z, 0, 1, 0);
      }
      audioExtras.drones.forEach(({ obj, panner }) => {
        setPannerPos(panner, obj.position.x, obj.position.y, obj.position.z);
      });
      audioExtras.speeders.forEach(({ obj, gain, panner }) => {
        setPannerPos(panner, obj.position.x, obj.position.y, obj.position.z);
        const level = 0.55 * Math.exp(-Math.pow(obj.position.x / 9, 2));
        gain.gain.setTargetAtTime(level, audioCtx.currentTime, 0.1);
      });
    }

    // ============================================================
    // ПАТЧ 10 — ОБЩИЕ ПОМОЩНИКИ (пар, световые пятна, обновления реквизита)
    // ============================================================
    const propUpdates = [];
    const steamEmitters = [];

    let _glowTex = null;
    function getGlowTex() {
      if (!_glowTex) _glowTex = createFogBankTexture();
      return _glowTex;
    }

    // Мягкое световое пятно на земле вместо лишней PointLight (дёшево для слабой видеокарты)
    function glowDecal(parent, x, z, size, colorHex, opacity, y = 0.012) {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(size, size),
        new THREE.MeshBasicMaterial({
          map: getGlowTex(),
          color: colorHex,
          transparent: true,
          opacity,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          toneMapped: false
        })
      );
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, y, z);
      parent.add(m);
      return m;
    }

    // Пар/дым: частицы затухают к чёрному (аддитивное смешивание), поэтому bloom их не «пережигает»
    function createSteamEmitter(pos, { count = 26, height = 2.4, spread = 0.22, size = 0.9, color = 0x9fb4ff } = {}) {
      const geo = new THREE.BufferGeometry();
      const posArr = new Float32Array(count * 3);
      const colArr = new Float32Array(count * 3);
      const data = [];
      for (let i = 0; i < count; i++) {
        data.push({
          age: Math.random(),
          speed: 0.2 + Math.random() * 0.2,
          ox: (Math.random() - 0.5) * spread,
          oz: (Math.random() - 0.5) * spread,
          ph: Math.random() * 6
        });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
      const mat = new THREE.PointsMaterial({
        map: getGlowTex(),
        size,
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const points = new THREE.Points(geo, mat);
      points.position.copy(pos);
      points.frustumCulled = false;
      islandGroup.add(points);

      const base = new THREE.Color(color).multiplyScalar(0.3);
      const emitter = {
        update(dt) {
          for (let i = 0; i < count; i++) {
            const d = data[i];
            d.age += dt * d.speed;
            if (d.age > 1) d.age -= 1;
            const a = d.age;
            posArr[i * 3] = d.ox + Math.sin(a * 3 + d.ph) * spread * a * 4;
            posArr[i * 3 + 1] = a * height;
            posArr[i * 3 + 2] = d.oz;
            const fade = Math.sin(Math.PI * a); // нарастает и гаснет
            colArr[i * 3] = base.r * fade;
            colArr[i * 3 + 1] = base.g * fade;
            colArr[i * 3 + 2] = base.b * fade;
          }
          geo.attributes.position.needsUpdate = true;
          geo.attributes.color.needsUpdate = true;
        }
      };
      steamEmitters.push(emitter);
      return emitter;
    }

    // ============================================================
    // ПАТЧ 11 — ЗАДВОРКИ: ЧЁРНЫЙ ХОД, МИГАЮЩАЯ ЛАМПА, КОНТЕЙНЕР, МУСОР, КОТ, ПРОВОДА
    // ============================================================
    function createCat() {
      const g = new THREE.Group();
      const fur = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.9 });
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x7dff6b, toneMapped: false });

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), fur);
      body.scale.set(1, 1.25, 1);
      body.position.y = 0.16;
      g.add(body);

      const head = new THREE.Group();
      head.position.y = 0.34;
      head.add(new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), fur));
      [-0.05, 0.05].forEach((x) => {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.07, 4), fur);
        ear.position.set(x, 0.085, 0);
        head.add(ear);
      });
      const eyes = [-0.035, 0.035].map((x) => {
        const e = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, 0.01), eyeMat);
        e.position.set(x, 0.01, 0.08);
        head.add(e);
        return e;
      });
      g.add(head);

      const tail = new THREE.Group();
      tail.position.set(0, 0.06, -0.1);
      const tailMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.025, 0.22, 4, 6), fur);
      tailMesh.rotation.x = Math.PI / 2;
      tailMesh.position.z = -0.12;
      tail.add(tailMesh);
      g.add(tail);

      g.userData.update = (t) => {
        tail.rotation.y = Math.sin(t * 1.4) * 0.5;
        head.rotation.y = Math.sin(t * 0.35) * 0.5;
        const blink = t % 5 < 0.12 ? 0.1 : 1;
        eyes.forEach((e) => (e.scale.y = blink));
      };
      return g;
    }

    function wire(a, b, sag = 0.5, r = 0.018) {
      const pts = [];
      for (let i = 0; i <= 6; i++) {
        const t = i / 6;
        const p = new THREE.Vector3().lerpVectors(a, b, t);
        p.y -= Math.sin(Math.PI * t) * sag;
        pts.push(p);
      }
      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, r, 5, false),
        new THREE.MeshStandardMaterial({ color: 0x0b0c12, roughness: 0.6, metalness: 0.3 })
      );
      islandGroup.add(mesh);
    }

    function buildBackAlley() {
      const g = hotelGroup;
      const add = (geo, mat, x, y, z, parent = g) => {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      };

      // Чёрный ход: дверь, рамка, ручка, табличка выхода, козырёк
      add(new THREE.BoxGeometry(1.1, 2.0, 0.04), MAT.metalPipe, 0.7, 1.0, -1.82);
      add(
        new THREE.BoxGeometry(0.95, 1.9, 0.08),
        new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.5, metalness: 0.6 }),
        0.7, 0.95, -1.84
      );
      add(new THREE.BoxGeometry(0.06, 0.2, 0.06), MAT.metalPipe, 1.1, 0.95, -1.92);
      add(
        new THREE.BoxGeometry(0.5, 0.14, 0.04),
        new THREE.MeshBasicMaterial({ color: 0x22ff88, toneMapped: false }),
        0.7, 2.28, -1.84
      );
      const awning = add(new THREE.BoxGeometry(1.3, 0.05, 0.5), MAT.roofTile, 0.7, 2.1, -2.05);
      awning.rotation.x = -0.2;

      // Мигающая настенная лампа и световое пятно на тротуаре
      add(new THREE.BoxGeometry(0.18, 0.12, 0.2), MAT.metalPipe, 1.55, 1.95, -1.9);
      const lensMat = new THREE.MeshBasicMaterial({ color: 0xffb703, toneMapped: false });
      add(new THREE.BoxGeometry(0.12, 0.05, 0.14), lensMat, 1.55, 1.87, -1.92);
      const decal = glowDecal(g, 1.0, -2.9, 3.4, 0xffa63d, 0.5);
      const lensOn = new THREE.Color(0xffb703);
      const lensOff = new THREE.Color(0x3a2a10);
      propUpdates.push((t) => {
        const dropout = Math.sin(t * 2.3) * Math.sin(t * 6.1) > 0.8;
        const f = dropout ? 0.15 : 0.85 + 0.15 * Math.sin(t * 17);
        lensMat.color.copy(lensOff).lerp(lensOn, f);
        decal.material.opacity = 0.5 * f;
      });

      // Труба вдоль стены с небольшой утечкой пара
      add(new THREE.CylinderGeometry(0.06, 0.06, 4.2, 8), MAT.metalPipe, -1.2, 2.1, -1.92);
      createSteamEmitter(
        new THREE.Vector3(4.8 - 1.2, 0.25 + 1.4, -2.8 - 2.05),
        { count: 16, height: 1.2, spread: 0.12, size: 0.5, color: 0xcbd5e1 }
      );

      // Контейнер для мусора
      const dumpster = new THREE.Group();
      dumpster.position.set(-0.9, 0, -2.8);
      dumpster.rotation.y = 0.2;
      const dumpMat = new THREE.MeshStandardMaterial({ color: 0x0f5132, roughness: 0.6, metalness: 0.3 });
      add(new THREE.BoxGeometry(1.5, 0.9, 0.8), dumpMat, 0, 0.45, 0, dumpster);
      add(
        new THREE.BoxGeometry(1.56, 0.06, 0.86),
        new THREE.MeshStandardMaterial({ color: 0x0b3b25, roughness: 0.6, metalness: 0.3 }),
        0, 0.93, 0, dumpster
      );
      [-0.5, 0, 0.5].forEach((x) => add(new THREE.BoxGeometry(0.05, 0.8, 0.03), MAT.metalPipe, x, 0.45, 0.41, dumpster));
      g.add(dumpster);

      // Кот на крышке контейнера (смотрит в сторону улицы)
      const cat = createCat();
      cat.position.set(-0.5, 0.96, -2.7);
      cat.rotation.y = 0.5;
      g.add(cat);
      propUpdates.push(cat.userData.update);

      // Мешки с мусором (глянцевый мокрый пластик)
      const bagMat = new THREE.MeshStandardMaterial({ color: 0x0b0b12, roughness: 0.22, metalness: 0.05 });
      [[0.5, -3.0, 0.26], [0.95, -2.7, 0.24], [0.3, -3.35, 0.22], [1.4, -3.1, 0.25]].forEach(([x, z, r]) => {
        const bag = add(new THREE.SphereGeometry(r, 12, 10), bagMat, x, r * 0.8, z);
        bag.scale.y = 0.8;
        bag.rotation.y = Math.random() * 6;
        add(new THREE.ConeGeometry(0.05, 0.1, 6), bagMat, x, r * 1.55, z);
      });

      // Ящики и разбросанные банки
      const crateMat = new THREE.MeshStandardMaterial({ color: 0x5b3a1e, roughness: 0.7 });
      add(new THREE.BoxGeometry(0.55, 0.45, 0.55), crateMat, 2.1, 0.225, -2.5);
      add(new THREE.BoxGeometry(0.45, 0.4, 0.45), crateMat, 2.05, 0.65, -2.5).rotation.y = 0.4;
      const canColors = [0xef4444, 0x38bdf8, 0xfacc15, 0x22c55e];
      for (let i = 0; i < 7; i++) {
        const can = add(
          new THREE.CylinderGeometry(0.04, 0.04, 0.11, 8),
          new THREE.MeshStandardMaterial({ color: canColors[i % 4], roughness: 0.35, metalness: 0.5 }),
          -1.6 + Math.random() * 3.6, 0.05, -2.4 - Math.random() * 1.4
        );
        can.rotation.z = Math.PI / 2 * (Math.random() > 0.5 ? 1 : 0);
        can.rotation.y = Math.random() * 6;
      }

      // Столб с проводами за отелем (координаты острова)
      const poleX = 3.4;
      const poleZ = -6.4;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 5.6, 8), MAT.timberDark);
      pole.position.set(poleX, 0.25 + 2.8, poleZ);
      pole.castShadow = true;
      islandGroup.add(pole);
      const arm = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.08), MAT.metalPipe);
      arm.position.set(poleX, 5.6, poleZ);
      islandGroup.add(arm);
      const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.55, 10), MAT.metalPipe);
      tank.position.set(poleX + 0.3, 4.8, poleZ);
      islandGroup.add(tank);

      wire(new THREE.Vector3(poleX - 0.7, 5.6, poleZ), new THREE.Vector3(3.4, 5.0, -4.65), 0.35);
      wire(new THREE.Vector3(poleX + 0.7, 5.6, poleZ), new THREE.Vector3(6.2, 5.0, -4.65), 0.45);

    function createBillboardTexture() {
      const w = 1024;
      const h = 572;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      const font = '"Segoe UI", Meiryo, "Hiragino Sans", "Yu Gothic", sans-serif';

      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, '#12062e');
      bg.addColorStop(1, '#3a0a52');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Диагональные неоновые полосы
      ctx.globalAlpha = 0.25;
      ['#00f3ff', '#ff007f'].forEach((col, i) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(560 + i * 140, 0);
        ctx.lineTo(640 + i * 140, 0);
        ctx.lineTo(360 + i * 140, h);
        ctx.lineTo(280 + i * 140, h);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Банка напитка
      const rr = (x, y, ww, hh, r) => {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + ww, y, x + ww, y + hh, r);
        ctx.arcTo(x + ww, y + hh, x, y + hh, r);
        ctx.arcTo(x, y + hh, x, y, r);
        ctx.arcTo(x, y, x + ww, y, r);
        ctx.closePath();
      };
      const cg = ctx.createLinearGradient(80, 0, 260, 0);
      cg.addColorStop(0, '#ff1744');
      cg.addColorStop(0.5, '#ff6b81');
      cg.addColorStop(1, '#a00f2e');
      rr(80, 80, 180, 410, 28);
      ctx.fillStyle = cg;
      ctx.fill();
      ctx.save();
      rr(80, 80, 180, 410, 28);
      ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(60, 300);
      ctx.quadraticCurveTo(170, 230, 290, 300);
      ctx.lineTo(290, 340);
      ctx.quadraticCurveTo(170, 270, 60, 340);
      ctx.fill();
      ctx.restore();

      const neon = (text, x, y, size, color, core) => {
        ctx.font = `bold ${size}px ${font}`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 36;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 14;
        ctx.fillText(text, x, y);
        ctx.fillStyle = core;
        ctx.shadowBlur = 5;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;
      };
      neon('NEO·KOLA', 310, 210, 130, '#00f3ff', '#ffffff');
      neon('ネオコーラ', 320, 350, 92, '#ff007f', '#fff0f8');
      neon('STAY ELECTRIC', 320, 460, 48, '#ffd166', '#fffbe6');

      ctx.shadowBlur = 24;
      ctx.shadowColor = '#00f3ff';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 8;
      ctx.strokeRect(16, 16, w - 32, h - 32);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function addBillboardNeon(g) {
      const baseColor = new THREE.Color(0xff007f);
      const frameMat = new THREE.MeshBasicMaterial({ color: baseColor.clone(), toneMapped: false });
      const fw = 3.6;

      const ft = 0.05;
      [
        [0, fh / 2, fw, ft],

    // ПАТЧ 16 — НАСТРОЙКИ КАЧЕСТВА И FPS-МЕТР
    // ============================================================
    const QUALITY_NAMES = ['LOW', 'MEDIUM', 'HIGH'];
    let quality = 2;
    let shadowEvery = 2; // обновлять тени каждые N кадров
    let shadowTick = 0;

    function setQuality(q) {
      quality = q;
      const w = window.innerWidth;
      const h = window.innerHeight;

      if (q === 2) {
        // HIGH: всё, как есть сейчас
        useBloom = true;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        shadowEvery = 2;
      } else if (q === 1) {
        // MEDIUM: bloom остаётся, но дешевле (в четверть разрешения), без тени от лампы у байка
        useBloom = true;
        renderer.setPixelRatio(1);
        shadowEvery = 4;
      } else {
        // LOW: без bloom
        useBloom = false;
        renderer.setPixelRatio(1);
        shadowEvery = 6;
      }

      renderer.setSize(w, h);
      composer.setPixelRatio(renderer.getPixelRatio());
      composer.setSize(w, h);
      if (q === 1) {
        const pr = renderer.getPixelRatio();
        bloomPass.setSize(Math.floor((w * pr) / 2), Math.floor((h * pr) / 2)); // внутри делится на 2 ещё раз
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyQ') setQuality((quality + 2) % 3); // HIGH -> MEDIUM -> LOW -> HIGH
    });

    // FPS-метр (клавиша F): FPS, число вызовов отрисовки, треугольники
    const fpsBox = document.createElement('div');
    Object.assign(fpsBox.style, {
      position: 'fixed', left: '12px', top: '12px', zIndex: '60', padding: '6px 10px',

      border: '1px solid rgba(0,243,255,.35)', borderRadius: '8px', display: 'none'
    });
    document.body.appendChild(fpsBox);
    let fpsFrames = 0;
    let fpsAcc = 0;
    let meterOn = false;
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyF') {
        meterOn = !meterOn;
        fpsBox.style.display = meterOn ? 'block' : 'none';
      }
    });

    function updateFpsMeter(rawDelta) {
      if (!meterOn) return;
      fpsFrames++;
      fpsAcc += rawDelta;
      if (fpsAcc >= 0.5) {
        const info = renderer.info.render;
        fpsBox.textContent =
          Math.round(fpsFrames / fpsAcc) + ' FPS | calls ' + info.calls +
          ' | tris ' + info.triangles + ' | ' + QUALITY_NAMES[quality];
        fpsFrames = 0;
        fpsAcc = 0;
      }
    }

    // ========================================================
    // 13. ANIMATION LOOP (Solid 60 FPS Performance)
    // ========================================================
    const clock = new THREE.Clock();

    // Reset clock and restart watchdog when tab returns from background
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        clock.getDelta(); // «съедает» накопленную паузу
        if (!fpsChecked) {
          warmupFrames = 0;
          fpsSamples = [];
          lastFrameTime = performance.now();
        }
      }
    });

    function patrolPos(t, phase, speed, ampX, ampZ, baseY, bobAmp, out) {
      const a = t * speed + phase;
      out.set(
        Math.sin(a) * ampX,
        baseY + Math.sin(t * 1.5 + phase) * bobAmp,
        Math.cos(a * 0.62) * ampZ
      );
      return out;
    }
    const _dTmpA = new THREE.Vector3();
    const _dTmpB = new THREE.Vector3();

    function updateDrone(drone, t, phase, speed, ampX, ampZ, baseY) {
      patrolPos(t, phase, speed, ampX, ampZ, baseY, 0.3, _dTmpA);
      patrolPos(t + 0.05, phase, speed, ampX, ampZ, baseY, 0.3, _dTmpB);
      drone.position.copy(_dTmpA);
      // «глаз» дрона смотрит в +Z, поэтому поворачиваем по направлению движения
      drone.rotation.y = Math.atan2(_dTmpB.x - _dTmpA.x, _dTmpB.z - _dTmpA.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.info.reset();

      // Clamp delta to avoid leaps after background tab pauses
      const rawDelta = clock.getDelta();
      const delta = Math.min(rawDelta, 0.05);
      const time = clock.getElapsedTime();

      // 1. Organic Island Levitation
      islandGroup.position.y = Math.sin(time * 0.8) * 0.28;

      // 2. Cinematic Camera Auto-Orbit Navigation (Smooth User Input Blending)
      const idleSec = (performance.now() - lastUserActionTime) / 1000;
      const wantCinematic = (!userInteracting && idleSec > 3.5);
      const kWeight = 1 - Math.exp(-1.8 * delta);
      cinematicWeight = THREE.MathUtils.lerp(cinematicWeight, wantCinematic ? 1.0 : 0.0, kWeight);

      if (cinematicWeight > 0.001) {
        autoOrbitAngle += delta * 0.16;

        // Radius modulates between 15.5 (close zoom on signs) and 31.0 (grand overview)
        const curRadius = 23.0 + Math.sin(time * 0.11) * 6.0 + Math.cos(time * 0.23) * 2.5;

        // Height modulates between 9.5 (low dramatic angle) and 20.0 (high isometric)
        const curHeight = 14.5 + Math.sin(time * 0.16) * 4.5 + Math.cos(time * 0.08) * 2.0;

        const desiredCamX = Math.cos(autoOrbitAngle) * curRadius;
        const desiredCamZ = Math.sin(autoOrbitAngle) * curRadius;
        const desiredCamY = curHeight;

        const desiredTargetX = Math.sin(time * 0.12) * 1.5;
        const desiredTargetY = 2.8 + Math.cos(time * 0.18) * 0.9;
        const desiredTargetZ = Math.cos(time * 0.14) * 1.5;

        const kCam = 1 - Math.exp(-2.2 * delta);
        camera.position.lerp(new THREE.Vector3(desiredCamX, desiredCamY, desiredCamZ), cinematicWeight * kCam);
        controls.target.lerp(new THREE.Vector3(desiredTargetX, desiredTargetY, desiredTargetZ), cinematicWeight * kCam);
      }
      controls.update();

      // 3. Fast Continuous Rain Streaks
      const rainPos = rainGeometry.attributes.position.array;
      for (let i = 0; i < rainCount; i++) {
        const idx = i * 6;
        const spd = rainSpeeds[i] * delta;

        rainPos[idx + 1] -= spd;
        rainPos[idx + 4] -= spd;

        if (rainPos[idx + 1] < 0.05) {
          const newY = 12 + Math.random() * 2;
          const sLen = 0.28 + Math.random() * 0.18;
          rainPos[idx + 1] = newY;
          rainPos[idx + 4] = newY - sLen;
        }
      }
      rainGeometry.attributes.position.needsUpdate = true;

      // 4. Expanding Surface Splash Ripples on Wet Asphalt
      for (let i = 0; i < rippleCount; i++) {
        const r = ripples[i];
        r.age += delta;

        if (r.age >= r.maxAge) {
          r.age = 0;
          r.x = (Math.random() - 0.5) * (platformW - 2.5);
          r.z = (Math.random() - 0.5) * (platformD - 2.5);
          r.maxScale = 0.6 + Math.random() * 0.8;
          r.maxAge = 0.5 + Math.random() * 0.4;
        }

        const progress = r.age / r.maxAge;
        const curScale = 0.1 + progress * r.maxScale;
        const onSidewalk = Math.abs(r.x) > 2.9;
        dummyObj.position.set(r.x, onSidewalk ? 0.27 : 0.03, r.z);
        dummyObj.scale.set(curScale, curScale, curScale);
        dummyObj.updateMatrix();
        rippleMesh.setMatrixAt(i, dummyObj.matrix);
      }
      rippleMesh.instanceMatrix.needsUpdate = true;

      // 5. Under-Island Rock Water Drips into the Abyss
      const dPos = dripGeo.attributes.position.array;
      for (let i = 0; i < dripCount; i++) {
        dPos[i * 3 + 1] -= dripData[i].speed * delta;
        if (dPos[i * 3 + 1] < -13.0) {
          dPos[i * 3 + 1] = dripData[i].startY;
        }
      }
      dripGeo.attributes.position.needsUpdate = true;

      // 6. Rooftop Holograms Rotation
      holo1.rotation.y = time * 0.8;
      h1Core.rotation.x = time * 0.9;
      h1Core.rotation.y = time * 0.6;
      holo2.rotation.y = -time * 0.7;
      holo2.rotation.x = Math.sin(time * 0.9) * 0.2;

      // 7. Traditional Paper Lanterns Gentle Swaying
      paperLanterns.forEach((l, idx) => {
        l.rotation.z = Math.sin(time * 2.2 + idx * 1.3) * 0.05;
      });

      // 8. Clean Patrol Drones Street Corridor Navigation
      updateDrone(drone1, time, 0.0, 0.50, 1.8, 6.2, 2.7);
      updateDrone(drone2, time, 2.4, 0.40, 1.6, 5.8, 3.3);

      // 9. AC Unit High-Speed Fan Spin
      acFan.rotation.z += delta * 24.0;

      // 10. Warm Ramen Steam Rising & Curling
      const sPos = steamGeo.attributes.position.array;
      for (let i = 0; i < steamParticleCount; i++) {
        const sd = steamData[i];
        sPos[i * 3 + 1] += sd.speed * delta;
        sPos[i * 3] = sd.srcX + Math.sin(time * 2.5 + sd.driftPhase) * 0.06;
        if (sPos[i * 3 + 1] > sd.yMax) {
          sPos[i * 3 + 1] = sd.yStart;
          sPos[i * 3] = sd.srcX + (Math.random() - 0.5) * 0.06;
        }
      }
      steamGeo.attributes.position.needsUpdate = true;

      // 11. Cyber Citizens (Capsule anatomy + procedurally animated limbs & breathing)
      citizens.forEach(c => c.userData.update(time));

      // 11b. Falling Sakura Petals (~60 particles gently drifting)
      const ptPos = petalGeo.attributes.position.array;
      for (let i = 0; i < petalCount; i++) {
        const pd = petalData[i];
        ptPos[i * 3 + 1] -= pd.fallSpeed * delta;
        ptPos[i * 3] = pd.baseX + Math.sin(time * pd.swaySpeed + pd.phase) * pd.swayRadius;
        ptPos[i * 3 + 2] = pd.baseZ + Math.cos(time * pd.swaySpeed * 0.7 + pd.phase) * (pd.swayRadius * 0.8);
        if (ptPos[i * 3 + 1] < 0.05) {
          ptPos[i * 3 + 1] = pd.yStart;
          pd.baseX = 4.6 + (Math.random() - 0.5) * 4.0;
          pd.baseZ = 2.8 + (Math.random() - 0.5) * 4.0;
        }
      }
      petalGeo.attributes.position.needsUpdate = true;

      // 12. Sign Lighting Effects:
      // «ラーメン»: constant subtle micro-flicker
      const rf = 0.93 + 0.07 * Math.sin(time * 24.0) + (Math.random() < 0.03 ? -0.22 : 0.03 * (Math.random() - 0.5));
      if (ramenLightbox.userData.faceMat) {
        ramenLightbox.userData.faceMat.color.setRGB(rf, rf * 0.95, rf * 0.85);
      }
      ramenWarmLight.intensity = 4.6 * rf;

      // «荒坂»: occasional digital power glitch (short blackout & fast strobing)
      const aGlitch = time % 6.8;
      let aPower = 1.0;
      if (aGlitch < 0.32) {
        aPower = Math.sin(aGlitch * 60.0) > 0 ? 0.95 : 0.05;
        if (aGlitch > 0.1 && aGlitch < 0.2) aPower = 0.0;
      }
      if (arasakaLightbox.userData.faceMat) {
        arasakaLightbox.userData.faceMat.color.setRGB(aPower, aPower * 0.09, aPower * 0.23);
      }
      if (arasakaGlow) {
        arasakaGlow.intensity = 3.2 * aPower;
      }

      // «カプセルホテル» & «義体»: slow organic breathing
      const bCyan = 0.85 + 0.15 * Math.sin(time * 1.6);
      if (hotelLightbox.userData.faceMat) {
        hotelLightbox.userData.faceMat.color.setRGB(bCyan * 0.8, bCyan, bCyan);
      }
      const bPurple = 0.86 + 0.14 * Math.cos(time * 1.4);
      if (gitaiLightbox.userData.faceMat) {
        gitaiLightbox.userData.faceMat.color.setRGB(bPurple, bPurple * 0.6, bPurple);
      }

      // 13. Slow Void Fog Drift
      cloudsGroup.rotation.y = time * 0.015;

      // 14. Distant Flying Speeders Horizontal Traffic & Organic Bobbing
      speeder1.position.x += 8.2 * delta;
      speeder1.position.y = 6.0 + Math.sin(time * 2.2) * 0.14;
      if (speeder1.position.x > 35) {
        speeder1.position.x = -35;
      }

      speeder2.position.x -= 10.5 * delta;
      speeder2.position.y = 8.8 + Math.cos(time * 1.9) * 0.16;
      if (speeder2.position.x < -35) {
        speeder2.position.x = 35;
      }

      speeder3.position.x += 5.2 * delta;
      speeder3.position.y = 4.2 + Math.sin(time * 1.3) * 0.12;
      if (speeder3.position.x > 40) speeder3.position.x = -40;

      // Gentle pulsing of under-island void levitation light
      underIslandLight.intensity = 5.2 + 0.6 * Math.sin(time * 2.0);

      // Micro-animations for Urban Props & Steam Emitters (Patches 10-13)
      propUpdates.forEach((fn) => fn(time));
      steamEmitters.forEach((e) => e.update(delta));

      // Spatial 3D Audio & Thunder/Lightning (Patch 9)
      updateAudio3D(camera);
      updateLightning(time, delta);

      // 15. FPS Performance Watchdog Check (skip 60 warmup frames, measure 3s, median FPS < 28)
      if (!fpsChecked && !document.hidden) {
        const now = performance.now();
        const frameDt = (now - lastFrameTime) / 1000;
        lastFrameTime = now;

        if (warmupFrames < WARMUP_COUNT) {
          warmupFrames++;
          if (warmupFrames === WARMUP_COUNT) {
            fpsMeasureStartTime = now;
            fpsSamples = [];
          }
        } else {
          if (frameDt > 0.0005 && frameDt < 0.5) {
            fpsSamples.push(1 / frameDt);
          }
          if (now - fpsMeasureStartTime >= 3000) {
            if (fpsSamples.length > 10) {
              fpsSamples.sort((a, b) => a - b);
              const medianFps = fpsSamples[Math.floor(fpsSamples.length / 2)];
              if (medianFps < 28 && quality > 0) {
                setQuality(quality - 1);
                warmupFrames = 0;
                fpsSamples = [];
                lastFrameTime = performance.now();
              } else {
                fpsChecked = true;
              }
            } else {
              fpsChecked = true;
            }
          }
        }
      }

      if (++shadowTick >= shadowEvery) { shadowTick = 0; renderer.shadowMap.needsUpdate = true; }
      updateFpsMeter(rawDelta);

      // 16. Render Frame (EffectComposer Bloom or Native Fallback)
      if (useBloom) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    animate();

    // Responsive Window Resize Handler
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      setQuality(quality);
    });

    // ============================================================
    // ПАТЧ 2 — ЗВУК: ДОЖДЬ + СИНТ-ПЭД (Web Audio, без файлов)
    // ============================================================
    // Нагрузка на процессор минимальная (несколько осцилляторов и один буфер шума),
    // на FPS почти не влияет. Звук по умолчанию ВЫКЛЮЧЕН: браузеры требуют клика.
    // Вставь этот блок в конец module-скрипта (после animate();).


    function buildAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(audioCtx.destination);

      // --- Дождь: зацикленный белый шум через фильтры ---
      const len = audioCtx.sampleRate * 2;
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;

      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 900;
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 7000;
      const rainGain = audioCtx.createGain();
      rainGain.gain.value = 0.2;

      noise.connect(hp);
      hp.connect(lp);
      lp.connect(rainGain);
      rainGain.connect(masterGain);
      noise.start();

      // --- Мягкий пэд: аккорд Am9, слегка расстроенные осцилляторы ---
      const padFilter = audioCtx.createBiquadFilter();
      padFilter.type = 'lowpass';
      padFilter.frequency.value = 700;
      padFilter.Q.value = 0.7;
      const padGain = audioCtx.createGain();
      padGain.gain.value = 0.022;
      padFilter.connect(padGain);
      padGain.connect(masterGain);

      [55, 110, 164.81, 220, 261.63, 329.63].forEach((f, i) => {
        [-6, 6].forEach((det) => {
          const o = audioCtx.createOscillator();
          o.type = i < 2 ? 'sine' : 'sawtooth';
          o.frequency.value = f;
          o.detune.value = det;
          o.connect(padFilter);
          o.start();
        });
      });

      // Медленное «дыхание» фильтра
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.07;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 350;
      lfo.connect(lfoGain);
      lfoGain.connect(padFilter.frequency);
      lfo.start();

      buildAudioExtras();
    }

    const soundBtn = document.createElement('button');
    soundBtn.textContent = '🔇 Звук';
    Object.assign(soundBtn.style, {
      position: 'absolute',
      right: '18px',
      bottom: '18px',
      zIndex: '50',
      padding: '10px 16px',
      font: '600 14px -apple-system, "Segoe UI", sans-serif',
      color: '#cffafe',
      background: 'rgba(11, 6, 29, 0.65)',
      border: '1px solid rgba(0, 243, 255, 0.5)',
      borderRadius: '999px',
      cursor: 'pointer',
      backdropFilter: 'blur(6px)'
    });
    document.body.appendChild(soundBtn);

    soundBtn.addEventListener('click', async () => {
      if (!audioCtx) buildAudio();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      audioOn = !audioOn;
      masterGain.gain.setTargetAtTime(audioOn ? 0.6 : 0, audioCtx.currentTime, 0.4);
      soundBtn.textContent = audioOn ? '🔊 Звук' : '🔇 Звук';
    });

    window.addEventListener('keydown', (e) => {
      if (e.code !== 'KeyH') return;
      const hide = soundBtn.style.display !== 'none';
      soundBtn.style.display = hide ? 'none' : '';
      fpsBox.style.display = 'none';
      meterOn = false;
    });

    // Не шуметь, когда вкладка скрыта
    document.addEventListener('visibilitychange', () => {
      if (!audioCtx) return;
      if (document.hidden) audioCtx.suspend();
      else if (audioOn) audioCtx.resume();
    });
  </script>
</body>
