<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Floating Island — 3D Low-Poly Diorama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #1a0f35 0%, #0b061d 60%, #05020e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Soft atmospheric vignette */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 45%, rgba(11, 6, 29, 0.4) 80%, rgba(6, 2, 16, 0.82) 100%);
    }

    /* Minimalist Loading Screen */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b061d;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 243, 255, 0.2);
      border-top-color: #00f3ff;
      border-right-color: #ff007f;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Import map for Three.js & Addons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-ring"></div>
  </div>

  <!-- 3D WebGL Canvas -->
  <div id="canvas-container"></div>
  <div class="vignette"></div>

  <!-- Main 3D Animation Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========================================================
    // 1. RENDERER, SCENE, FOG & ISOMETRIC CAMERA
    // ========================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // Atmospheric deep dark-purple fog (not pitch black!)
    scene.background = new THREE.Color(0x0b061d);
    scene.fog = new THREE.FogExp2(0x0b061d, 0.012);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(25, 17, 25);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Smooth turntable camera auto-rotation
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.85; // Cozy cinematic rotation speed
    controls.minDistance = 14;
    controls.maxDistance = 48;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.target.set(0, 2.8, 0);

    // Main Floating Island Master Group (levitates organically)
    const islandGroup = new THREE.Group();
    scene.add(islandGroup);

    // ========================================================
    // 1b. CRISP 3D HD NEON LIGHTBOX BUILDERS (1024x512 / 512x1024)
    // ========================================================
    function createHDNeonSignTexture({
      width = 1024,
      height = 512,
      text = '',
      color = '#00f3ff',
      glowColor = '#00f3ff',
      coreColor = '#ffffff',
      isVertical = false,
      fontSize = 210,
      border = true
    }) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // Deep dark acrylic diffuser backing
      ctx.fillStyle = '#06070e';
      ctx.fillRect(0, 0, width, height);

      // Dual-pass razor-sharp neon border frame
      if (border) {
        const strokeW = Math.max(6, Math.round(width / 140));
        ctx.strokeStyle = color;
        ctx.lineWidth = strokeW;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 32;
        ctx.strokeRect(20, 20, width - 40, height - 40);

        ctx.strokeStyle = coreColor;
        ctx.lineWidth = Math.max(2, Math.round(strokeW / 3));
        ctx.shadowBlur = 8;
        ctx.strokeRect(20, 20, width - 40, height - 40);
      }

      // Authentic Japanese Sans-Serif Typography: Meiryo & Segoe UI
      const fontFam = '"Segoe UI", Meiryo, "Hiragino Sans", "Yu Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (isVertical) {
        const chars = Array.from(text);
        const lineSpacing = (height - 60) / chars.length;
        const startY = 30 + lineSpacing / 2;

        ctx.font = `bold ${fontSize}px ${fontFam}`;

        // Pass 1: Broad diffuse outer neon bloom
        ctx.fillStyle = color;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 40;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });

        // Pass 2: Intense inner neon glow
        ctx.fillStyle = color;
        ctx.shadowBlur = 18;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });

        // Pass 3: Brilliant white core
        ctx.fillStyle = coreColor;
        ctx.shadowBlur = 6;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });
      } else {
        const centerY = height * 0.5;
        ctx.font = `bold ${fontSize}px ${fontFam}`;

        // Pass 1: Broad diffuse outer neon bloom
        ctx.fillStyle = color;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 44;
        ctx.fillText(text, width / 2, centerY);

        // Pass 2: Medium concentrated glow
        ctx.fillStyle = color;
        ctx.shadowBlur = 20;
        ctx.fillText(text, width / 2, centerY);

        // Pass 3: Razor white hot core
        ctx.fillStyle = coreColor;
        ctx.shadowBlur = 6;
        ctx.fillText(text, width / 2, centerY);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      return texture;
    }

    // Real 3D Physical Lightbox with deep metal chassis, raised beveled frame & mounting brackets
    function create3DLightboxMesh({
      w = 2.8,
      h = 1.3,
      d = 0.22,
      texture,
      doubleSided = false,
      bracketType = 'wall' // 'wall', 'roof', 'hanging'
    }) {
      const group = new THREE.Group();

      const chassisMat = new THREE.MeshStandardMaterial({
        color: 0x0c0e14,
        roughness: 0.38,
        metalness: 0.72
      });
      const bracketMat = new THREE.MeshStandardMaterial({
        color: 0x161a24,
        roughness: 0.45,
        metalness: 0.8
      });

      // 1. Deep Metallic Enclosure Box (Chassis)
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), chassisMat);
      chassis.castShadow = true;
      group.add(chassis);

      // 2. Raised Outer Bezel Rim (Frames the glowing acrylic face)
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0x1a1e2b,
        roughness: 0.3,
        metalness: 0.85
      });
      const topRim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.04, d + 0.02), rimMat);
      topRim.position.y = h / 2 + 0.02;
      group.add(topRim);

      const botRim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.04, d + 0.02), rimMat);
      botRim.position.y = -h / 2 - 0.02;
      group.add(botRim);

      const leftRim = new THREE.Mesh(new THREE.BoxGeometry(0.04, h + 0.08, d + 0.02), rimMat);
      leftRim.position.x = -w / 2 - 0.02;
      group.add(leftRim);

      const rightRim = new THREE.Mesh(new THREE.BoxGeometry(0.04, h + 0.08, d + 0.02), rimMat);
      rightRim.position.x = w / 2 + 0.02;
      group.add(rightRim);

      // 3. Glowing Acrylic Neon Face (Recessed inside the bezel)
      const faceGeo = new THREE.PlaneGeometry(w - 0.02, h - 0.02);
      const faceMat = new THREE.MeshBasicMaterial({
        map: texture,
        toneMapped: false
      });

      const frontFace = new THREE.Mesh(faceGeo, faceMat);
      frontFace.position.z = d / 2 + 0.006;
      group.add(frontFace);

      if (doubleSided) {
        const backFace = new THREE.Mesh(faceGeo, faceMat);
        backFace.position.z = -d / 2 - 0.006;
        backFace.rotation.y = Math.PI;
        group.add(backFace);
      }

      // 4. Heavy Industrial Mounting Brackets
      if (bracketType === 'wall') {
        [-h * 0.35, h * 0.35].forEach(yB => {
          const arm = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.07, 0.07), bracketMat);
          arm.position.set(-w / 2 - 0.19, yB, 0);
          group.add(arm);

          const flange = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.2, 0.2), bracketMat);
          flange.position.set(-w / 2 - 0.38, yB, 0);
          group.add(flange);
        });
      } else if (bracketType === 'roof') {
        [-w * 0.38, w * 0.38].forEach(xB => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.85, 8), bracketMat);
          leg.position.set(xB, -h / 2 - 0.42, 0);
          group.add(leg);

          const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.1, 6), bracketMat);
          strut.position.set(xB, -h / 4 - 0.3, -0.42);
          strut.rotation.x = -0.7;
          group.add(strut);
        });
      } else if (bracketType === 'hanging') {
        [-w * 0.36, w * 0.36].forEach(xB => {
          const hanger = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.38, 0.1), bracketMat);
          hanger.position.set(xB, h / 2 + 0.19, 0);
          group.add(hanger);
        });
      }

      return group;
    }

    // ========================================================
    // 2. MATERIALS PALETTE (Balanced Metalness for Wet Sheen)
    // ========================================================
    // Important: metalness kept around 0.25 - 0.3 so surfaces don't black out without envMap!
    const MAT = {
      // Wet Asphalt: low roughness (0.12) + moderate metalness (0.28) for juicy pointlight specular highlights
      asphaltWet: new THREE.MeshStandardMaterial({
        color: 0x1a1f30,
        roughness: 0.12,
        metalness: 0.28
      }),
      // Sidewalk concrete
      sidewalk: new THREE.MeshStandardMaterial({
        color: 0x333e56,
        roughness: 0.45,
        metalness: 0.15
      }),
      // Road Markings (Yellow & White)
      roadYellow: new THREE.MeshStandardMaterial({
        color: 0xffaa00,
        emissive: 0xff9900,
        emissiveIntensity: 0.6,
        roughness: 0.2
      }),
      roadWhite: new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        roughness: 0.25
      }),
      // Wet Roof Tiles
      roofTile: new THREE.MeshStandardMaterial({
        color: 0x1e2438,
        roughness: 0.14,
        metalness: 0.3
      }),
      // Cyber timber / dark frames
      timberDark: new THREE.MeshStandardMaterial({
        color: 0x161a26,
        roughness: 0.5,
        metalness: 0.2
      }),
      // Traditional vermilion red accents
      cyberRed: new THREE.MeshStandardMaterial({
        color: 0xd92626,
        roughness: 0.35,
        metalness: 0.2
      }),
      // Glowing Window Lattices & Screens
      windowWarm: new THREE.MeshStandardMaterial({
        color: 0xffbe0b,
        emissive: 0xffa000,
        emissiveIntensity: 2.5,
        roughness: 0.2
      }),
      windowCyan: new THREE.MeshStandardMaterial({
        color: 0x00f3ff,
        emissive: 0x00f3ff,
        emissiveIntensity: 2.5,
        roughness: 0.2
      }),
      // Vibrant Neon Materials (MeshBasicMaterial for pure luminous pop)
      neonPink: new THREE.MeshBasicMaterial({
        color: 0xff007f
      }),
      neonCyan: new THREE.MeshBasicMaterial({
        color: 0x00f3ff
      }),
      neonPurple: new THREE.MeshBasicMaterial({
        color: 0xb5179e
      }),
      neonAmber: new THREE.MeshBasicMaterial({
        color: 0xffaa00
      }),
      // Sakura tree foliage (multitiered semi-transparent glowing pink/magenta clusters)
      sakuraLeaves: new THREE.MeshStandardMaterial({
        color: 0xff69b4,
        emissive: 0xff1493,
        emissiveIntensity: 1.1,
        roughness: 0.35,
        transparent: true,
        opacity: 0.88
      }),
      sakuraTrunk: new THREE.MeshStandardMaterial({
        color: 0x24151b,
        roughness: 0.85
      }),
      // Floating island rock / voxel dirt underbelly
      rockDark: new THREE.MeshStandardMaterial({
        color: 0x181c2b,
        roughness: 0.88,
        metalness: 0.15
      }),
      rockAccent: new THREE.MeshStandardMaterial({
        color: 0x23293d,
        roughness: 0.82,
        metalness: 0.2
      }),
      // Metallic pipes and structural girders
      metalPipe: new THREE.MeshStandardMaterial({
        color: 0x475569,
        roughness: 0.35,
        metalness: 0.6
      }),
      metalRust: new THREE.MeshStandardMaterial({
        color: 0x854d0e,
        roughness: 0.55,
        metalness: 0.4
      })
    };

    // ========================================================
    // 3. ENHANCED LIGHTING (Hemisphere + Directional + PointLights)
    // ========================================================
    // 1. Hemisphere Light: violet sky & cyan ground for crisp edge definition
    const hemiLight = new THREE.HemisphereLight(0x8866ff, 0x00d2ff, 1.5);
    scene.add(hemiLight);

    // 2. Directional Key Light with soft shadows
    const dirLight = new THREE.DirectionalLight(0xd8b4fe, 1.3);
    dirLight.position.set(15, 26, 12);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 65;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    dirLight.shadow.bias = -0.001;
    scene.add(dirLight);

    // 3. Strategic Colored PointLights for vibrant specular pools on wet asphalt:
    // Warm Golden-Orange Light from the Ramen Bar
    const ramenWarmLight = new THREE.PointLight(0xff9500, 4.6, 14, 1.7);
    ramenWarmLight.position.set(-2.8, 2.2, -1.8);
    islandGroup.add(ramenWarmLight);

    // Hot Pink Light from Pagoda & Signs
    const neonPinkLight = new THREE.PointLight(0xff007f, 4.2, 15, 1.8);
    neonPinkLight.position.set(-3.8, 3.8, 1.6);
    islandGroup.add(neonPinkLight);

    // Electric Cyan / Turquoise Light from Hotel & Vending Machines
    const neonCyanLight = new THREE.PointLight(0x00f3ff, 4.2, 15, 1.7);
    neonCyanLight.position.set(3.8, 3.2, -2.2);
    islandGroup.add(neonCyanLight);

    // Lush Pink Glow right inside the Sakura Tree Canopy
    const sakuraPinkLight = new THREE.PointLight(0xff1493, 4.0, 13, 1.8);
    sakuraPinkLight.position.set(4.6, 3.2, 2.8);
    islandGroup.add(sakuraPinkLight);

    // Deep Violet Light from Hotel Signboard
    const hotelPurpleLight = new THREE.PointLight(0xaa00ff, 3.5, 12, 1.8);
    hotelPurpleLight.position.set(4.2, 5.2, -1.0);
    islandGroup.add(hotelPurpleLight);

    // Streetlamp Cyan Spotlight
    const streetLampLight = new THREE.PointLight(0x38bdf8, 3.2, 12, 1.6);
    streetLampLight.position.set(3.4, 4.4, 4.0);
    islandGroup.add(streetLampLight);

    // Soft Violet-Blue Void Under-Island Light (emphasizes island levitating in air)
    const underIslandLight = new THREE.PointLight(0x6366f1, 5.5, 26, 1.8);
    underIslandLight.position.set(0, -8.5, 0);
    islandGroup.add(underIslandLight);

    const underIslandVoidGlow = new THREE.PointLight(0x7c3aed, 4.0, 20, 1.6);
    underIslandVoidGlow.position.set(0, -12.0, 0);
    islandGroup.add(underIslandVoidGlow);

    // ========================================================
    // 4. FLOATING ISLAND PLATFORM & UNDERBELLY (Voxel/Rock Depth)
    // ========================================================
    const platformW = 15;
    const platformD = 15;
    const platformH = 1.2;

    // Wet Asphalt Surface Deck
    const deckGeo = new THREE.BoxGeometry(platformW, platformH, platformD);
    const deckMesh = new THREE.Mesh(deckGeo, MAT.asphaltWet);
    deckMesh.position.y = -platformH / 2;
    deckMesh.receiveShadow = true;
    islandGroup.add(deckMesh);

    // Sidewalk Raised Platforms (Left & Right)
    const swGeoL = new THREE.BoxGeometry(4.6, 0.25, platformD - 0.2);
    const swMeshL = new THREE.Mesh(swGeoL, MAT.sidewalk);
    swMeshL.position.set(-5.2, 0.12, 0);
    swMeshL.receiveShadow = true;
    swMeshL.castShadow = true;
    islandGroup.add(swMeshL);

    const swGeoR = new THREE.BoxGeometry(4.6, 0.25, platformD - 0.2);
    const swMeshR = new THREE.Mesh(swGeoR, MAT.sidewalk);
    swMeshR.position.set(5.2, 0.12, 0);
    swMeshR.receiveShadow = true;
    swMeshR.castShadow = true;
    islandGroup.add(swMeshR);

    // Double Yellow Center Road Markings
    const yLineGeo = new THREE.BoxGeometry(0.12, 0.02, platformD - 0.6);
    const yLine1 = new THREE.Mesh(yLineGeo, MAT.roadYellow);
    yLine1.position.set(-0.12, 0.01, 0);
    islandGroup.add(yLine1);

    const yLine2 = new THREE.Mesh(yLineGeo, MAT.roadYellow);
    yLine2.position.set(0.12, 0.01, 0);
    islandGroup.add(yLine2);

    // Pedestrian Zebra Crosswalk Stripes
    for (let i = -2.2; i <= 2.2; i += 0.7) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.02, 1.8), MAT.roadWhite);
      stripe.position.set(i, 0.01, 4.4);
      islandGroup.add(stripe);
    }

    // Road Edge Guardrails & Caution Light Strips
    [-1, 1].forEach((dir) => {
      const zPos = dir * (platformD / 2 - 0.3);
      for (let x = -2.6; x <= 2.6; x += 1.3) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.85, 0.12), MAT.metalPipe);
        post.position.set(x, 0.42, zPos);
        islandGroup.add(post);
      }
      const rail = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.14, 0.08), MAT.neonAmber);
      rail.position.set(0, 0.68, zPos);
      islandGroup.add(rail);

      const hazLight = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.24), MAT.neonPink);
      hazLight.position.set(dir * 2.5, 0.8, zPos);
      islandGroup.add(hazLight);
    });

    // Deep Stepped Voxel / Rock Underbelly (Tapering 12 units down)
    const rockSteps = [
      { w: 14.4, d: 14.4, h: 1.1, y: -1.6 },
      { w: 13.0, d: 13.0, h: 1.3, y: -2.7 },
      { w: 11.2, d: 11.2, h: 1.5, y: -4.0 },
      { w: 9.0,  d: 9.0,  h: 1.6, y: -5.4 },
      { w: 6.8,  d: 6.8,  h: 1.8, y: -7.0 },
      { w: 4.4,  d: 4.4,  h: 1.8, y: -8.6 },
      { w: 2.2,  d: 2.2,  h: 1.8, y: -10.2 },
      { w: 0.9,  d: 0.9,  h: 1.4, y: -11.6 }
    ];

    rockSteps.forEach((step, idx) => {
      const stepMesh = new THREE.Mesh(
        new THREE.BoxGeometry(step.w, step.h, step.d),
        idx % 2 === 0 ? MAT.rockDark : MAT.rockAccent
      );
      stepMesh.position.y = step.y;
      stepMesh.receiveShadow = true;
      stepMesh.castShadow = true;
      islandGroup.add(stepMesh);
    });

    // Structural Steel I-Beam Girders supporting the island
    const beamGeo = new THREE.BoxGeometry(0.25, 0.25, 12);
    const beam1 = new THREE.Mesh(beamGeo, MAT.metalRust);
    beam1.position.set(-3.5, -1.8, 0);
    beam1.rotation.y = 0.35;
    islandGroup.add(beam1);

    const beam2 = new THREE.Mesh(beamGeo, MAT.metalRust);
    beam2.position.set(3.5, -1.8, 0);
    beam2.rotation.y = -0.35;
    islandGroup.add(beam2);

    // Multi-Cluster 3D Hanging Cables (CatmullRomCurve3 Curves under Island)
    const cableRoutes = [
      [[-4.5, -1.2, 4], [-2.5, -5.5, 2], [-0.5, -10.5, 0]],
      [[4.5, -1.2, -4], [2.2, -6.2, -2], [0.4, -11.0, 0]],
      [[-3.8, -1.2, -4.5], [-1.8, -5.0, -2.5], [0, -9.5, 0]],
      [[3.8, -1.2, 4.5], [1.8, -5.2, 2.2], [0, -10.2, 0]],
      [[-5.2, -1.2, 0], [-3.0, -7.0, 0.5], [-0.2, -11.8, 0]],
      [[5.2, -1.2, 0], [3.0, -7.2, -0.5], [0.2, -11.8, 0]]
    ];

    cableRoutes.forEach((pts) => {
      const vPts = pts.map(p => new THREE.Vector3(...p));
      const curve = new THREE.CatmullRomCurve3(vPts);
      const tubeGeo = new THREE.TubeGeometry(curve, 22, 0.05, 6, false);
      const cable = new THREE.Mesh(tubeGeo, MAT.timberDark);
      islandGroup.add(cable);
    });

    // Protruding Drainage Pipes jutting out from rock
    [
      { x: -6.0, y: -2.4, z: 2.2, rotZ: 0.32, mat: MAT.metalPipe },
      { x: 5.8, y: -3.4, z: -1.8, rotZ: -0.38, mat: MAT.metalRust },
      { x: -3.6, y: -4.8, z: -5.0, rotX: 0.42, mat: MAT.metalPipe },
      { x: 2.8, y: -6.2, z: 3.5, rotX: -0.4, mat: MAT.metalRust }
    ].forEach((pipe) => {
      const pMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 2.4, 8), pipe.mat);

      fTire.rotation.x = Math.PI / 2;
      fTire.castShadow = true;
      fWheelGroup.add(fTire);

      // Glowing Neon Discs on Wheels (Solid inner aero disc + outer glowing rim)
      [-0.095, 0.095].forEach(zSide => {
        const innerDisc = new THREE.Mesh(new THREE.CircleGeometry(0.18, 16), neonCyanDisc);
        innerDisc.position.z = zSide;
        fWheelGroup.add(innerDisc);

        const rimRing = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.022, 8, 20), neonCyanDisc);
        rimRing.position.z = zSide;
        fWheelGroup.add(rimRing);
      });
      bikeGroup.add(fWheelGroup);

      // 2. REAR WHEEL ASSEMBLY (Fat rear drive tire with glowing neon discs)
      const rWheelGroup = new THREE.Group();
      rWheelGroup.position.set(-0.76, 0.35, 0);

      const rTire = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.24, 20), tireRubber);
      rTire.rotation.x = Math.PI / 2;
      rTire.castShadow = true;
      rWheelGroup.add(rTire);

      [-0.125, 0.125].forEach(zSide => {
        const innerDisc = new THREE.Mesh(new THREE.CircleGeometry(0.20, 16), neonCyanDisc);
        innerDisc.position.z = zSide;
        rWheelGroup.add(innerDisc);

        const rimRing = new THREE.Mesh(new THREE.TorusGeometry(0.29, 0.024, 8, 20), neonCyanDisc);
        rimRing.position.z = zSide;
        rWheelGroup.add(rimRing);
      });
      bikeGroup.add(rWheelGroup);

      // 3. LOW STRETCHED MONOCOQUE CHASSIS (Dark Carbon)
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 0.3), darkCarbon);
      chassis.position.set(0, 0.26, 0);
      bikeGroup.add(chassis);

      // 4. DISTINCTIVE AERODYNAMIC RAKED FRONT COWL (Akira Crimson Red)
      const frontCowl = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.3, 0.4), akiraRed);
      frontCowl.position.set(0.42, 0.46, 0);
      frontCowl.rotation.z = -0.18;
      frontCowl.castShadow = true;
      bikeGroup.add(frontCowl);

      // Sloped front nose beak
      const noseBeak = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.2, 0.32), akiraRed);
      noseBeak.position.set(0.88, 0.4, 0);
      noseBeak.rotation.z = -0.32;
      noseBeak.castShadow = true;
      bikeGroup.add(noseBeak);

      // 5. SHARPLY RAKED WINDSHIELD / CANOPY
      const screenMat = new THREE.MeshStandardMaterial({
        color: 0x040d18,
        roughness: 0.05,
        metalness: 0.95,
        emissive: 0x00f3ff,
        emissiveIntensity: 0.2
      });
      const windshield = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.24, 0.28), screenMat);
      windshield.position.set(0.45, 0.65, 0);
      windshield.rotation.z = -0.48;
      bikeGroup.add(windshield);

      // 6. LOW RECUMBENT BUCKET SEAT (Black Leather)
      const seatCushion = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.14, 0.26), leatherSeat);
      seatCushion.position.set(-0.15, 0.46, 0);
      bikeGroup.add(seatCushion);

      const seatBackrest = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.28, 0.26), leatherSeat);
      seatBackrest.position.set(-0.38, 0.56, 0);
      seatBackrest.rotation.z = 0.22;
      bikeGroup.add(seatBackrest);

      // 7. STREAMLINED REAR TAIL COWL (Akira Crimson Red)
      const tailCowl = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.28, 0.36), akiraRed);
      tailCowl.position.set(-0.58, 0.54, 0);
      tailCowl.rotation.z = 0.12;
      tailCowl.castShadow = true;
      bikeGroup.add(tailCowl);

      // 8. TWIN CHROME EXHAUST PIPES
      [-0.18, 0.18].forEach(zE => {
        const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.8, 8), chromeExhaust);
        pipe.rotation.z = Math.PI / 2;
        pipe.position.set(-0.45, 0.22, zE);
        bikeGroup.add(pipe);
      });

      // 9. HANDLEBARS & CYBER COCKPIT CONSOLE
      const handlebars = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.52), darkCarbon);
      handlebars.position.set(0.36, 0.7, 0);
      bikeGroup.add(handlebars);

      // 10. FRONT HIGH-BEAM CYBER HEADLIGHT
      const headlight = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.12, 0.24),
        new THREE.MeshBasicMaterial({ color: 0xecfeff, toneMapped: false })
      );
      headlight.position.set(1.08, 0.4, 0);
      bikeGroup.add(headlight);

      // 11. REAR TWIN NEON BRAKE LIGHTS
      const taillight = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.08, 0.24),
        new THREE.MeshBasicMaterial({ color: 0xff1744, toneMapped: false })
      );
      taillight.position.set(-0.92, 0.58, 0);
      bikeGroup.add(taillight);

      // 12. UNDER-GLOW NEON ONTO WET ASPHALT
      const underGlow = new THREE.PointLight(0x00f3ff, 2.2, 4.0, 2.0);
      underGlow.position.set(0, 0.1, 0);
      bikeGroup.add(underGlow);

      return bikeGroup;
    }

    // Parked at the sidewalk curb near the pedestrian crosswalk zebra
    const akiraBike = createYaibaKusanagiBike();
    akiraBike.position.set(-3.2, 0.14, 1.4);
    akiraBike.rotation.y = -0.22;
    akiraBike.castShadow = true;
    islandGroup.add(akiraBike);

    // ========================================================
    // 10. CLEAN PATROL DRONES (No Cones, PointLight & Glowing Eye)
    // ========================================================
    function createCleanPatrolDrone(eyeColorHex) {
      const droneGroup = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x1a202c,
        roughness: 0.35,
        metalness: 0.65
      });

      // Central aerodynamic chassis
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.12, 0.48), bodyMat);
      body.castShadow = true;
      droneGroup.add(body);

      // Glowing Visor Eye
      const eye = new THREE.Mesh(
        new THREE.BoxGeometry(0.24, 0.06, 0.06),
        new THREE.MeshBasicMaterial({ color: eyeColorHex, toneMapped: false })
      );
      eye.position.set(0, 0, 0.25);
      droneGroup.add(eye);

      // 4 Perimeter Thruster Rings
      [[-0.26, -0.26], [0.26, -0.26], [-0.26, 0.26], [0.26, 0.26]].forEach(([tx, tz]) => {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(0.08, 0.02, 6, 12),
          new THREE.MeshBasicMaterial({ color: eyeColorHex, toneMapped: false })
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.set(tx, 0.04, tz);
        droneGroup.add(ring);
      });

      // Downward PointLight casting dynamic illumination on wet asphalt (NO CONE!)
      const downLight = new THREE.PointLight(eyeColorHex, 2.6, 7.5, 1.8);
      downLight.position.set(0, -0.2, 0);
      droneGroup.add(downLight);

      islandGroup.add(droneGroup);
      return droneGroup;
    }

    const drone1 = createCleanPatrolDrone(0x00f3ff);
    const drone2 = createCleanPatrolDrone(0xa855f7);

    // ========================================================
    // 11. DELICATE SHORT FAST RAIN STREAKS & RIPPLES
    // ========================================================
    // 700 thin, fast, translucent streaks strictly over the island (opacity 0.35)
    const rainCount = 700;
    const rainGeo = new THREE.BufferGeometry();
    const rainPositions = new Float32Array(rainCount * 6);
    const rainSpeeds = [];

    for (let i = 0; i < rainCount; i++) {
      const x = (Math.random() - 0.5) * (platformW - 1.2);
      const z = (Math.random() - 0.5) * (platformD - 1.2);
      const y = 0.5 + Math.random() * 14;
      const len = 0.28 + Math.random() * 0.18; // Short, thin, and crisp

      const idx = i * 6;
      rainPositions[idx] = x;
      rainPositions[idx + 1] = y;
      rainPositions[idx + 2] = z;
      rainPositions[idx + 3] = x - 0.02 * len;
      rainPositions[idx + 4] = y - len;
      rainPositions[idx + 5] = z;

      rainSpeeds.push(26.0 + Math.random() * 10.0);
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainMat = new THREE.LineBasicMaterial({
      color: 0x93c5fd,
      transparent: true,
      opacity: 0.35
    });
    const rainSystem = new THREE.LineSegments(rainGeo, rainMat);
    islandGroup.add(rainSystem);

    // Expanding Splash Ripples on Asphalt
    const rippleCount = 36;
    const rippleGeo = new THREE.RingGeometry(0.05, 0.11, 16);
    rippleGeo.rotateX(-Math.PI / 2);
    const rippleMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8,
      transparent: true,
      opacity: 0.5,
      side: THREE.DoubleSide
    });
    const rippleMesh = new THREE.InstancedMesh(rippleGeo, rippleMat, rippleCount);
    islandGroup.add(rippleMesh);

    const ripples = [];
    const dummyObj = new THREE.Object3D();
    for (let i = 0; i < rippleCount; i++) {
      ripples.push({
        x: (Math.random() - 0.5) * (platformW - 2.5),
        z: (Math.random() - 0.5) * (platformD - 2.5),
        age: Math.random(),
        maxAge: 0.55 + Math.random() * 0.45,
        maxScale: 0.65 + Math.random() * 0.85
      });
    }

    // ========================================================
    // 12. DISTANT DRIFTING VOID CLOUDS
    // ========================================================
    const cloudsGroup = new THREE.Group();
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0x140c28,
      roughness: 0.95,
      metalness: 0.05
    });

    for (let c = 0; c < 7; c++) {
      const cg = new THREE.DodecahedronGeometry(3.5 + Math.random() * 3.0, 0);
      const cm = new THREE.Mesh(cg, cloudMat);
      const angle = (c / 7) * Math.PI * 2;
      const radius = 24 + Math.random() * 8;
      cm.position.set(Math.cos(angle) * radius, -9 - Math.random() * 5, Math.sin(angle) * radius);
      cm.scale.set(1.9, 0.4, 1.4);
      cloudsGroup.add(cm);
    }
    scene.add(cloudsGroup);

    // ========================================================
    // 12b. DISTANT FLYING SPEEDERS WITH NEON LIGHT TRAILS
    // ========================================================
    function createNeonTrailTexture(colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 256, 0);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(0.3, 'rgba(0,0,0,0)');
      grad.addColorStop(0.75, colorHex);
      grad.addColorStop(1.0, '#ffffff');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 32);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createFlyingSpeeder({
      bodyColor = 0x161a24,
      lightColorHex = '#ff1a35',
      lightColorNum = 0xff1a35,
      headlightColor = 0x38bdf8,
      trailLength = 6.2
    }) {
      const speederGroup = new THREE.Group();

      // Sleek low-poly aerodynamic chassis
      const bodyGeo = new THREE.BoxGeometry(1.4, 0.22, 0.52);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: bodyColor,
        roughness: 0.35,
        metalness: 0.5
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      speederGroup.add(body);

      // Angled nose hood
      const noseGeo = new THREE.ConeGeometry(0.32, 0.45, 4);
      noseGeo.rotateZ(-Math.PI / 2);
      noseGeo.rotateY(Math.PI / 4);
      const nose = new THREE.Mesh(noseGeo, bodyMat);
      nose.position.set(0.85, 0, 0);
      speederGroup.add(nose);

      // Tinted cyber cockpit canopy
      const canopyGeo = new THREE.BoxGeometry(0.55, 0.16, 0.34);
      const canopyMat = new THREE.MeshStandardMaterial({
        color: 0x0a101d,
        roughness: 0.1,
        metalness: 0.8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.35
      });
      const canopy = new THREE.Mesh(canopyGeo, canopyMat);
      canopy.position.set(0.12, 0.14, 0);
      speederGroup.add(canopy);

      // Stabilizer wings
      [-0.32, 0.32].forEach(z => {
        const wing = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.04, 0.22), bodyMat);
        wing.position.set(-0.15, -0.02, z);
        speederGroup.add(wing);
      });

      // Front Headlights
      [-0.16, 0.16].forEach(z => {
        const hl = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 8, 8),
          new THREE.MeshBasicMaterial({ color: headlightColor, toneMapped: false })
        );
        hl.position.set(1.0, 0, z);
        speederGroup.add(hl);
      });

      // Rear Engine Thrusters
      [-0.18, 0.18].forEach(z => {
        const tl = new THREE.Mesh(
          new THREE.BoxGeometry(0.06, 0.1, 0.12),
          new THREE.MeshBasicMaterial({ color: lightColorNum, toneMapped: false })
        );
        tl.position.set(-0.72, 0.02, z);
        speederGroup.add(tl);
      });

      // Neon Light Trails (Horizontal & Vertical Cross-Ribbons for 360° visibility)
      const trailTex = createNeonTrailTexture(lightColorHex);
      const trailMat = new THREE.MeshBasicMaterial({
        map: trailTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false,
        toneMapped: false
      });

      [-0.18, 0.18].forEach(z => {
        const trailHGeo = new THREE.PlaneGeometry(trailLength, 0.08);
        const trailH = new THREE.Mesh(trailHGeo, trailMat);
        trailH.rotation.x = Math.PI / 2;
        trailH.position.set(-0.72 - trailLength / 2, 0.02, z);
        speederGroup.add(trailH);

        const trailVGeo = new THREE.PlaneGeometry(trailLength, 0.08);
        const trailV = new THREE.Mesh(trailVGeo, trailMat);
        trailV.position.set(-0.72 - trailLength / 2, 0.02, z);
        speederGroup.add(trailV);
      });

      return speederGroup;
    }

    // Speeder 1: Lower corridor, travels along +X with scarlet neon light trails
    const speeder1 = createFlyingSpeeder({
      bodyColor: 0x161a24,
      lightColorHex: '#ff1a35',
      lightColorNum: 0xff1a35,
      headlightColor: 0x38bdf8,
      trailLength: 6.5
    });
    speeder1.position.set(-15, 6.0, -15.0);
    scene.add(speeder1);

    // Speeder 2: Higher corridor, travels along -X with electric cyan neon light trails
    const speeder2 = createFlyingSpeeder({
      bodyColor: 0x181e2b,
      lightColorHex: '#00f3ff',
      lightColorNum: 0x00f3ff,
      headlightColor: 0xffd166,
      trailLength: 7.2
    });
    speeder2.rotation.y = Math.PI; // Face -X direction
    speeder2.position.set(12, 8.8, -18.5);
    scene.add(speeder2);

    // Hide loader smoothly once scene is ready
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('hidden');
    }, 400);

    // ========================================================
    // 13. ANIMATION LOOP (Solid 60 FPS Performance)
    // ========================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 1. Organic Island Levitation
      islandGroup.position.y = Math.sin(time * 0.8) * 0.28;

      // 2. Turntable OrbitControls
      controls.update();

      // 3. Rooftop Holograms Rotation
      holo1.rotation.y = time * 0.8;
      h1Core.rotation.x = time * 0.9;
      h1Core.rotation.y = time * 0.6;
      holo2.rotation.y = -time * 0.7;
      holo2.rotation.x = Math.sin(time * 0.9) * 0.2;

      // 4. Traditional Paper Lanterns Gentle Swaying
      paperLanterns.forEach((l, idx) => {
        l.rotation.z = Math.sin(time * 2.2 + idx * 1.3) * 0.05;
      });

      // 5. Clean Patrol Drones Organic Flight Trajectory (No Cones!)
      const d1Angle = time * 0.62;
      drone1.position.set(
        Math.cos(d1Angle) * 7.5,
        3.8 + Math.sin(time * 1.5) * 0.4,
        Math.sin(d1Angle) * 7.5 + Math.cos(time * 0.7) * 1.1
      );
      drone1.rotation.y = -d1Angle + Math.PI / 2;

      const d2Angle = -time * 0.48 + Math.PI;
      drone2.position.set(
        Math.cos(d2Angle) * 6.8,
        4.6 + Math.cos(time * 1.7) * 0.45,
        Math.sin(d2Angle) * 6.8 + Math.sin(time * 0.8) * 0.9
      );
      drone2.rotation.y = -d2Angle + Math.PI / 2;

      // 6. Rare Neon-Green Coolant Drips from Rusty Pipe
      const cPos = coolantDropGeo.attributes.position.array;
      for (let i = 0; i < coolantDropCount; i++) {
        const cd = coolantDropData[i];
        cPos[i * 3 + 1] -= cd.speed * delta;
        if (cPos[i * 3 + 1] < -13.0) {
          cPos[i * 3 + 1] = cd.startY;
        }
      }
      coolantDropGeo.attributes.position.needsUpdate = true;

      // 11. Slow Void Clouds Drift
      cloudsGroup.rotation.y = time * 0.015;

      // 11b. Distant Flying Speeders Horizontal Traffic & Organic Bobbing
      speeder1.position.x += 8.2 * delta;
      speeder1.position.y = 6.0 + Math.sin(time * 2.2) * 0.14;
      if (speeder1.position.x > 35) {
        speeder1.position.x = -35;
      }

      speeder2.position.x -= 10.5 * delta;
      speeder2.position.y = 8.8 + Math.cos(time * 1.9) * 0.16;
      if (speeder2.position.x < -35) {
        speeder2.position.x = 35;
      }

      // Gentle pulsing of under-island void levitation light
      underIslandLight.intensity = 5.2 + 0.6 * Math.sin(time * 2.0);

      // 12. Render Frame
      renderer.render(scene, camera);
    }

    animate();

    // Responsive Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
