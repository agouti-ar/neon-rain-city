<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Cyberpunk Floating Island — 3D Low-Poly Diorama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #1a0f35 0%, #0b061d 60%, #05020e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Soft atmospheric vignette */
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 45%, rgba(11, 6, 29, 0.4) 80%, rgba(6, 2, 16, 0.82) 100%);
    }

    /* Minimalist Loading Screen */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b061d;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 243, 255, 0.2);
      border-top-color: #00f3ff;
      border-right-color: #ff007f;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Import map for Three.js & Addons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-ring"></div>
  </div>

  <!-- 3D WebGL Canvas -->
  <div id="canvas-container"></div>
  <div class="vignette"></div>

  <!-- Main 3D Animation Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    // Visible error banner
    window.addEventListener('error', (e) => {
      if (document.getElementById('err-banner')) return;
      const d = document.createElement('div');
      d.id = 'err-banner';
      d.textContent = 'JS error: ' + e.message;
      Object.assign(d.style, {
        position: 'fixed', left: '12px', bottom: '12px', zIndex: '200',
        background: '#7f1d1d', color: '#fff', padding: '8px 12px',
        font: '12px monospace', maxWidth: '60vw', borderRadius: '6px'
      });
      document.body.appendChild(d);
    });

    // ========================================================
    // 1. RENDERER, SCENE, FOG & ISOMETRIC CAMERA
    // ========================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // Atmospheric deep dark-purple fog (not pitch black!)
    scene.background = new THREE.Color(0x0b061d);
    scene.fog = new THREE.FogExp2(0x0b061d, 0.012);

    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(25, 17, 25);
    applyResponsiveFov();

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.info.autoReset = false;
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;
    container.appendChild(renderer.domElement);

    // ========================================================
    // 1b. PROCEDURAL CYBERPUNK ENVMAP (PMREMGenerator)
    // ========================================================
    const pmremGen = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x06030e);

    const envPalette = [0xff007f, 0x00f3ff, 0xffaa00, 0xa855f7, 0x38bdf8, 0xff1744];
    for (let i = 0; i < 14; i++) {
      const angle = (i / 14) * Math.PI * 2;
      const radius = 25;
      const col = envPalette[i % envPalette.length];
      const gMat = new THREE.MeshBasicMaterial({ color: col });
      const w = 4 + Math.random() * 5;
      const h = 10 + Math.random() * 16;
      const gMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1), gMat);
      gMesh.position.set(Math.cos(angle) * radius, 6 + (Math.random() - 0.5) * 8, Math.sin(angle) * radius);
      gMesh.lookAt(0, 4, 0);
      envScene.add(gMesh);
    }
    const envRenderTarget = pmremGen.fromScene(envScene);
    const proceduralEnvMap = envRenderTarget.texture;
    pmremGen.dispose();

    // ========================================================
    // 1c. POST-PROCESSING (EffectComposer, MSAA Samples: 2, UnrealBloom & OutputPass)
    // ========================================================
    const composerRenderTarget = new THREE.WebGLRenderTarget(
      window.innerWidth,
      window.innerHeight,
      {
        type: THREE.HalfFloatType,
        samples: 2 // MSAA on render target
      }
    );

    const composer = new EffectComposer(renderer, composerRenderTarget);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    // UnrealBloomPass in half-resolution: threshold 0.4 keeps dark scene clean, pops neons
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(Math.floor(window.innerWidth / 2), Math.floor(window.innerHeight / 2)),
      0.65, // strength
      0.5, // radius
      0.4  // threshold
    );
    composer.addPass(bloomPass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    // Performance Watchdog: skip ~60 warmup frames, measure 3s, use median FPS (cutoff < 28)
    let useBloom = true;
    let fpsChecked = false;
    let warmupFrames = 0;
    const WARMUP_COUNT = 60;
    let fpsSamples = [];
    let fpsMeasureStartTime = 0;
    let lastFrameTime = performance.now();

    // Toggle bloom manually with 'B'
    window.addEventListener('keydown', (e) => {
      if (e.key === 'b' || e.key === 'B' || e.code === 'KeyB') {
        useBloom = !useBloom;
        fpsChecked = true;
        const w = window.innerWidth;
        const h = window.innerHeight;
        if (useBloom) {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          composer.setSize(w, h);
          bloomPass.resolution.set(Math.floor(w / 2), Math.floor(h / 2));
        } else {
          renderer.setPixelRatio(1);
          renderer.setSize(w, h);
        }
      }
    });

    // ========================================================
    // 1d. CINEMATIC PROCEDURAL CAMERA NAVIGATION & USER INPUT
    // ========================================================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false; // Controlled smoothly by cinematic system
    controls.minDistance = 12;
    controls.maxDistance = 48;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.target.set(0, 2.8, 0);

    let userInteracting = false;
    let lastUserActionTime = performance.now();
    let autoOrbitAngle = Math.atan2(camera.position.z, camera.position.x);
    let cinematicWeight = 1.0;

    controls.addEventListener('start', () => {
      userInteracting = true;
      lastUserActionTime = performance.now();
    });
    controls.addEventListener('end', () => {
      userInteracting = false;
      lastUserActionTime = performance.now();
      autoOrbitAngle = Math.atan2(camera.position.z, camera.position.x);
    });

    const onUserActivity = () => {
      lastUserActionTime = performance.now();
    };
    window.addEventListener('pointerdown', onUserActivity);
    window.addEventListener('wheel', onUserActivity, { passive: true });

    // Main Floating Island Master Group (levitates organically)
    const islandGroup = new THREE.Group();
    scene.add(islandGroup);
    const propUpdates = [];

    // ========================================================
    // 1b. CRISP 3D HD NEON LIGHTBOX BUILDERS (1024x512 / 512x1024)
    // ========================================================
    function createHDNeonSignTexture({
      width = 1024,
      height = 512,
      text = '',
      color = '#00f3ff',
      glowColor = '#00f3ff',
      coreColor = '#ffffff',
      isVertical = false,
      fontSize = 210,
      border = true
    }) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // Deep dark acrylic diffuser backing
      ctx.fillStyle = '#06070e';
      ctx.fillRect(0, 0, width, height);

      // Dual-pass razor-sharp neon border frame
      if (border) {
        const strokeW = Math.max(6, Math.round(width / 140));
        ctx.strokeStyle = color;
        ctx.lineWidth = strokeW;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 32;
        ctx.strokeRect(20, 20, width - 40, height - 40);

        ctx.strokeStyle = coreColor;
        ctx.lineWidth = Math.max(2, Math.round(strokeW / 3));
        ctx.shadowBlur = 8;
        ctx.strokeRect(20, 20, width - 40, height - 40);
      }

      // Authentic Japanese Sans-Serif Typography: Meiryo & Segoe UI
      const fontFam = '"Segoe UI", Meiryo, "Hiragino Sans", "Yu Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (isVertical) {
        const chars = Array.from(text);
        const lineSpacing = (height - 60) / chars.length;
        const startY = 30 + lineSpacing / 2;

        ctx.font = `bold ${fontSize}px ${fontFam}`;

        // Pass 1: Broad diffuse outer neon bloom
        ctx.fillStyle = color;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 40;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });

        // Pass 2: Intense inner neon glow
        ctx.fillStyle = color;
        ctx.shadowBlur = 18;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });

        // Pass 3: Brilliant white core
        ctx.fillStyle = coreColor;
        ctx.shadowBlur = 6;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, width / 2, startY + i * lineSpacing);
        });
      } else {
        const centerY = height * 0.5;
        ctx.font = `bold ${fontSize}px ${fontFam}`;

        // Pass 1: Broad diffuse outer neon bloom
        ctx.fillStyle = color;
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 44;
        ctx.fillText(text, width / 2, centerY);

        // Pass 2: Medium concentrated glow
        ctx.fillStyle = color;
        ctx.shadowBlur = 20;
        ctx.fillText(text, width / 2, centerY);

        // Pass 3: Razor white hot core
        ctx.fillStyle = coreColor;
        ctx.shadowBlur = 6;
        ctx.fillText(text, width / 2, centerY);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      return texture;
    }

    // Real 3D Physical Lightbox with deep metal chassis, raised beveled frame & mounting brackets
    function create3DLightboxMesh({
      w = 2.8,
      h = 1.3,
      d = 0.22,
      texture,
      doubleSided = false,
      bracketType = 'wall' // 'wall', 'roof', 'hanging'
    }) {
      const group = new THREE.Group();

      const chassisMat = new THREE.MeshStandardMaterial({
        color: 0x0c0e14,
        roughness: 0.38,
        metalness: 0.72
      });
      const bracketMat = new THREE.MeshStandardMaterial({
        color: 0x161a24,
        roughness: 0.45,
        metalness: 0.8
      });

      // 1. Deep Metallic Enclosure Box (Chassis)
      const chassis = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), chassisMat);
      chassis.castShadow = true;
      group.add(chassis);

      // 2. Raised Outer Bezel Rim (Frames the glowing acrylic face)
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0x1a1e2b,
        roughness: 0.3,
        metalness: 0.85
      });
      const topRim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.04, d + 0.02), rimMat);
      topRim.position.y = h / 2 + 0.02;
      group.add(topRim);

      const botRim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.04, d + 0.02), rimMat);
      botRim.position.y = -h / 2 - 0.02;
      group.add(botRim);

      const leftRim = new THREE.Mesh(new THREE.BoxGeometry(0.04, h + 0.08, d + 0.02), rimMat);
      leftRim.position.x = -w / 2 - 0.02;
      group.add(leftRim);

      const rightRim = new THREE.Mesh(new THREE.BoxGeometry(0.04, h + 0.08, d + 0.02), rimMat);
      rightRim.position.x = w / 2 + 0.02;
      group.add(rightRim);

      // 3. Glowing Acrylic Neon Face (Recessed inside the bezel)
      const faceGeo = new THREE.PlaneGeometry(w - 0.02, h - 0.02);
      const faceMat = new THREE.MeshBasicMaterial({
        map: texture,
        toneMapped: false
      });

      const frontFace = new THREE.Mesh(faceGeo, faceMat);
      frontFace.position.z = d / 2 + 0.006;
      group.add(frontFace);

      group.userData.faceMat = faceMat;
      group.userData.frontFace = frontFace;

      if (doubleSided) {
        const backFace = new THREE.Mesh(faceGeo, faceMat);
        backFace.position.z = -d / 2 - 0.006;
        backFace.rotation.y = Math.PI;
        group.add(backFace);
        group.userData.backFace = backFace;
      }

      // 4. Heavy Industrial Mounting Brackets
      if (bracketType === 'wall') {
        [-h * 0.35, h * 0.35].forEach(yB => {
          const arm = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.07, 0.07), bracketMat);
          arm.position.set(-w / 2 - 0.19, yB, 0);
          group.add(arm);

          const flange = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.2, 0.2), bracketMat);
          flange.position.set(-w / 2 - 0.38, yB, 0);
          group.add(flange);
        });
      } else if (bracketType === 'roof') {
        [-w * 0.38, w * 0.38].forEach(xB => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.85, 8), bracketMat);
          leg.position.set(xB, -h / 2 - 0.42, 0);
          group.add(leg);

          const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.1, 6), bracketMat);
          strut.position.set(xB, -h / 4 - 0.3, -0.42);
          strut.rotation.x = -0.7;
          group.add(strut);
        });
      } else if (bracketType === 'hanging') {
        [-w * 0.36, w * 0.36].forEach(xB => {
          const hanger = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.38, 0.1), bracketMat);
          hanger.position.set(xB, h / 2 + 0.19, 0);
          group.add(hanger);
        });
      }

      return group;
    }

    // ========================================================
    // 2. MATERIALS PALETTE (Balanced Metalness for Wet Sheen)
    // ========================================================
    // Important: metalness kept around 0.25 - 0.3 so surfaces don't black out without envMap!
    const MAT = {
      // Wet Asphalt: low roughness (0.12) + moderate metalness (0.28) + PMREM envMap reflections
      asphaltWet: new THREE.MeshStandardMaterial({
        color: 0x1a1f30,
        roughness: 0.12,
        metalness: 0.28,
        envMap: proceduralEnvMap,
        envMapIntensity: 0.5
      }),
      // Sidewalk concrete
      sidewalk: new THREE.MeshStandardMaterial({
        color: 0x333e56,
        roughness: 0.45,
        metalness: 0.15
      }),
      // Road Markings (Yellow & White)
      roadYellow: new THREE.MeshStandardMaterial({
        color: 0xffaa00,
        emissive: 0xff9900,
        emissiveIntensity: 0.6,
        roughness: 0.2
      }),
      roadWhite: new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        roughness: 0.25
      }),
      // Wet Roof Tiles
      roofTile: new THREE.MeshStandardMaterial({
        color: 0x1e2438,
        roughness: 0.14,
        metalness: 0.3
      }),
      // Cyber timber / dark frames
      timberDark: new THREE.MeshStandardMaterial({
        color: 0x161a26,
        roughness: 0.5,
        metalness: 0.2
      }),
      // Traditional vermilion red accents
      cyberRed: new THREE.MeshStandardMaterial({
        color: 0xd92626,
        roughness: 0.35,
        metalness: 0.2
      }),
      // Glowing Window Lattices & Screens
      windowWarm: new THREE.MeshStandardMaterial({
        color: 0xffbe0b,
        emissive: 0xffa000,
        emissiveIntensity: 1.1,
        roughness: 0.2
      }),
      windowCyan: new THREE.MeshStandardMaterial({
        color: 0x00f3ff,
        emissive: 0x00f3ff,
        emissiveIntensity: 1.1,
        roughness: 0.2
      }),
      // Vibrant Neon Materials (MeshBasicMaterial for pure luminous pop)
      neonPink: new THREE.MeshBasicMaterial({
        color: 0xff007f
      }),
      neonCyan: new THREE.MeshBasicMaterial({
        color: 0x00f3ff
      }),
      neonPurple: new THREE.MeshBasicMaterial({
        color: 0xb5179e
      }),
      neonAmber: new THREE.MeshBasicMaterial({
        color: 0xffaa00
      }),
      // Sakura tree foliage (multitiered semi-transparent glowing pink/magenta clusters)
      sakuraLeaves: new THREE.MeshStandardMaterial({
        color: 0xff69b4,
        emissive: 0xff1493,
        emissiveIntensity: 0.5,
        roughness: 0.35,
        transparent: true,
        opacity: 0.88
      }),
      sakuraTrunk: new THREE.MeshStandardMaterial({
        color: 0x24151b,
        roughness: 0.85
      }),
      // Floating island rock / voxel dirt underbelly
      rockDark: new THREE.MeshStandardMaterial({
        color: 0x181c2b,
        roughness: 0.88,
        metalness: 0.15
      }),
      rockAccent: new THREE.MeshStandardMaterial({
        color: 0x23293d,
        roughness: 0.82,
        metalness: 0.2
      }),
      // Metallic pipes and structural girders
      metalPipe: new THREE.MeshStandardMaterial({
        color: 0x475569,
        roughness: 0.35,
        metalness: 0.6
      }),
      metalRust: new THREE.MeshStandardMaterial({
        color: 0x854d0e,
        roughness: 0.55,
        metalness: 0.4
      })
    };

    // ========================================================
    // 3. ENHANCED LIGHTING (Hemisphere + Directional + PointLights)
    // ========================================================
    // 1. Hemisphere Light: violet sky & cyan ground for crisp edge definition
    const hemiLight = new THREE.HemisphereLight(0x8866ff, 0x00d2ff, 1.5);
    scene.add(hemiLight);

    // 2. Directional Key Light with soft shadows
    const dirLight = new THREE.DirectionalLight(0xd8b4fe, 1.3);
    dirLight.position.set(15, 26, 12);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 65;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -15;
    dirLight.shadow.bias = -0.001;
    scene.add(dirLight);

    // 3. Strategic Colored PointLights for vibrant specular pools on wet asphalt:
    // Warm Golden-Orange Light from the Ramen Bar (placed inside hollow stall interior)
    const ramenWarmLight = new THREE.PointLight(0xff9500, 4.6, 14, 1.7);
    ramenWarmLight.position.set(-4.8, 2.05, -1.1);
    islandGroup.add(ramenWarmLight);

    // Hot Pink Light from Pagoda & Signs
    const neonPinkLight = new THREE.PointLight(0xff007f, 4.2, 15, 1.8);
    neonPinkLight.position.set(-3.8, 3.8, 1.6);
    islandGroup.add(neonPinkLight);

    // Electric Cyan / Turquoise Light from Hotel & Vending Machines
    const neonCyanLight = new THREE.PointLight(0x00f3ff, 4.2, 15, 1.7);
    neonCyanLight.position.set(3.8, 3.2, -2.2);
    islandGroup.add(neonCyanLight);

    // Lush Pink Glow right inside the Sakura Tree Canopy
    const sakuraPinkLight = new THREE.PointLight(0xff1493, 4.0, 13, 1.8);
    sakuraPinkLight.position.set(4.6, 3.2, 2.8);
    islandGroup.add(sakuraPinkLight);

    // Deep Violet Light from Hotel Signboard
    const hotelPurpleLight = new THREE.PointLight(0xaa00ff, 3.5, 12, 1.8);
    hotelPurpleLight.position.set(4.2, 5.2, -1.0);
    islandGroup.add(hotelPurpleLight);

    // Streetlamp Cyan Spotlight
    const streetLampLight = new THREE.PointLight(0x38bdf8, 3.2, 12, 1.6);
    streetLampLight.position.set(3.4, 4.4, 4.0);
    islandGroup.add(streetLampLight);

    // Soft Violet-Blue Void Under-Island Light (emphasizes island levitating in air)
    const underIslandLight = new THREE.PointLight(0x6366f1, 5.5, 26, 1.8);
    underIslandLight.position.set(0, -8.5, 0);
    islandGroup.add(underIslandLight);

    const underIslandVoidGlow = new THREE.PointLight(0x7c3aed, 4.0, 20, 1.6);
    underIslandVoidGlow.position.set(0, -12.0, 0);
    islandGroup.add(underIslandVoidGlow);

    // ========================================================
    // 4. FLOATING ISLAND PLATFORM & UNDERBELLY (Voxel/Rock Depth)
    // ========================================================
    const platformW = 15;
    const platformD = 15;
    const platformH = 1.2;

    // Wet Asphalt Surface Deck
    const deckGeo = new THREE.BoxGeometry(platformW, platformH, platformD);
    const deckMesh = new THREE.Mesh(deckGeo, MAT.asphaltWet);
    deckMesh.position.y = -platformH / 2;
    deckMesh.receiveShadow = true;
    islandGroup.add(deckMesh);

    // Sidewalk Raised Platforms (Left & Right)
    const swGeoL = new THREE.BoxGeometry(4.6, 0.25, platformD - 0.2);
    const swMeshL = new THREE.Mesh(swGeoL, MAT.sidewalk);
    swMeshL.position.set(-5.2, 0.12, 0);
    swMeshL.receiveShadow = true;
    swMeshL.castShadow = true;
    islandGroup.add(swMeshL);

    const swGeoR = new THREE.BoxGeometry(4.6, 0.25, platformD - 0.2);
    const swMeshR = new THREE.Mesh(swGeoR, MAT.sidewalk);
    swMeshR.position.set(5.2, 0.12, 0);
    swMeshR.receiveShadow = true;
    swMeshR.castShadow = true;
    islandGroup.add(swMeshR);

    // Double Yellow Center Road Markings

    function limb(radius, length, mat) {
      const pivot = new THREE.Group();
      const geo = new THREE.CapsuleGeometry(radius, length, 4, 8);
      geo.translate(0, -(length / 2 + radius), 0); // Pivot at capsule joint origin
      pivot.add(new THREE.Mesh(geo, mat));
      pivot.userData.total = length + radius * 2;
      return pivot;
    }

    function createCitizen({
      coat = 0x141824, trim = 0x00f3ff, sitting = false, longCoat = false, hood = true, visor = true,
      headband = false, apron = false, eating = false,
      hat = null, hatColor = 0x1f2937, scarf = null, mask = false, glowTrim = false,
      skin = 0x9c7a68, hair = 0x07080c, phase = Math.random() * 6, backStripe = true
    } = {}) {
      const g = new THREE.Group();
      const coatMat = new THREE.MeshStandardMaterial({ color: coat, roughness: 0.75, metalness: 0.1 });
      const darkMat = new THREE.MeshStandardMaterial({ color: hair, roughness: 0.9 });

      body.add(stripe);

      if (glowTrim) {
        [-1, 1].forEach((s) => {
          const st = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.4, 0.02), glowMat);
          st.position.set(s * 0.085, 0.3, 0.112);
          body.add(st);
        });
      }

      if (longCoat && !sitting) {
        const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.26, 0.5, 12), coatMat);
        skirt.scale.set(1, 1, 0.8);
        skirt.position.y = hipY - 0.08;
        g.add(skirt);
      }

      if (apron) {

          new THREE.BoxGeometry(0.26, 0.42, 0.02),
          new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.9 })

        ap.position.set(0, 0.2, 0.115);
        body.add(ap);

      if (scarf !== null) {
        const sm = new THREE.MeshStandardMaterial({ color: scarf, roughness: 0.85 });

        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.58;
        const tail = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.24, 0.03), sm);
        tail.position.set(0.09, 0.44, 0.13);

      const head = new THREE.Group();

      if (hood) {

        hd.position.z = -0.02;

        face.position.z = 0.045;

        head.add(new THREE.Mesh(new THREE.SphereGeometry(0.115, 14, 10), skinMat));
        const hairCap = new THREE.Mesh(
          new THREE.SphereGeometry(0.125, 14, 8, 0, Math.PI * 2, 0, Math.PI / 1.9),
          darkMat
        );
        hairCap.position.set(0, 0.01, -0.01);
        head.add(hairCap);
        [-0.04, 0.04].forEach((ex) => {
          const eye = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 0.01), blackMat);
          eye.position.set(ex, 0.0, 0.112);

        });

      if (visor) {

      if (mask === 'respirator') {

      if (headband) {

      if (hat === 'kasa') { // Conical straw笠 with neon rim
        const kasa = new THREE.Mesh(

        );
        kasa.position.y = 0.13;
        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.29, 0.01, 6, 24), glowMat);

      } else if (hat === 'beanie') {
        const hm = new THREE.MeshStandardMaterial({ color: hatColor, roughness: 0.9 });

        const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.025, 6, 16), hm);

        dome.position.y = 0.03;

      } else if (hat === 'fedora') {
        const hm = new THREE.MeshStandardMaterial({ color: hatColor, roughness: 0.8 });
        const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.115, 0.1, 12), hm);

        const brimF = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.012, 16), hm);

      // Upper limbs: shoulder and forearm hierarchy
      const makeArm = (side) => {
        const upper = limb(0.045, 0.2, coatMat);
        upper.position.set(side * 0.2, 0.5, 0);
        const fore = limb(0.04, 0.2, coatMat);

      const armL = makeArm(-1);
      const armR = makeArm(1);

      const makeLeg = (side) => {
        const thigh = limb(0.065, 0.24, coatMat);

        foot.position.set(0, -shin.userData.total + 0.01, 0.04);
        shin.add(foot);
        g.add(thigh);
        return { thigh, shin };
      };
      const legL = makeLeg(-1);
      const legR = makeLeg(1);

      let chopsticks = null;
      if (sitting) {
        [legL, legR].forEach((l) => {
          l.thigh.rotation.x = -Math.PI / 2;
          l.shin.rotation.x = Math.PI / 2;

        armL.upper.rotation.x = -0.5;
        armL.fore.rotation.x = -0.9;
        armR.upper.rotation.x = -0.7;
        armR.fore.rotation.x = -1.3;
        if (eating) {

            new THREE.CylinderGeometry(0.006, 0.006, 0.24, 4),

          armR.fore.add(chopsticks);

        armL.fore.rotation.x = -0.25;
        armR.fore.rotation.x = -0.25;

      g.userData.headYaw = 0;
      g.userData.headPitch = 0;

        torso.scale.y = 1 + Math.sin(t * 1.6 + phase) * 0.015;
        head.rotation.y = Math.sin(t * 0.4 + phase) * 0.15 + g.userData.headYaw;
        head.rotation.x = Math.sin(t * 0.55 + phase) * 0.04 + g.userData.headPitch;
        if (sitting && eating) {
          const lift = Math.pow(Math.max(0, Math.sin(t * 1.2 + phase)), 2);
          armR.fore.rotation.x = -1.3 + lift * 0.45;
        }
      };
      g.userData.parts = { torso, head, body, armL, armR, legL, legR };
      g.userData.hipY = hipY;
      g.userData.stripe = stripe;
      return g;
    }

    function createEmblemTexture(glyph, color) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0a0a0f';
      ctx.beginPath();
      ctx.arc(64, 64, 58, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(64, 64, 54, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 76px "Yu Gothic", Meiryo, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(glyph, 64, 70);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    function bodyOf(citizen) {
      return citizen.userData.parts ? citizen.userData.parts.body : citizen;
    }

    function addBackEmblem(citizen, glyph = '侍', color = '#ff1744') {
      if (citizen.userData.stripe) citizen.userData.stripe.visible = false;
      const patch = new THREE.Mesh(
        new THREE.PlaneGeometry(0.26, 0.26),
        new THREE.MeshBasicMaterial({ map: createEmblemTexture(glyph, color), transparent: true, toneMapped: false })
      );
      patch.position.set(0, 0.3, -0.113);
      patch.rotation.y = Math.PI;
      bodyOf(citizen).add(patch);
    }

    function createTechEmblemTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const hex = (r) => {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = Math.PI / 6 + (i * Math.PI) / 3;
          const x = 64 + r * Math.cos(a);
          const y = 64 + r * Math.sin(a);
          if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        }
        ctx.closePath();
      };
      ctx.fillStyle = '#0a0a0f';
      hex(60);
      ctx.fill();
      ctx.strokeStyle = '#7ffcff';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#7ffcff';
      ctx.shadowBlur = 12;
      hex(56);
      ctx.stroke();
      ctx.fillStyle = '#7ffcff';
      ctx.fillRect(56, 24, 16, 42);
      ctx.fillRect(43, 37, 42, 16);
      ctx.shadowBlur = 0;
      ctx.font = 'bold 20px "Yu Gothic", Meiryo, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('鑑識', 64, 96);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;

    function createBadgeTexture(kind) {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 72;
      const ctx = c.getContext('2d');
      if (kind === 'tech') {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(4, 4, 56, 64);
        ctx.strokeStyle = '#7ffcff';
        ctx.lineWidth = 4;
        ctx.strokeRect(6, 6, 52, 60);
        ctx.fillStyle = '#7ffcff';
        ctx.fillRect(28, 18, 8, 36);
        ctx.fillRect(18, 28, 28, 8);
      } else {
        ctx.fillStyle = '#d4af37'; // Shield badge livery
        ctx.beginPath();
        ctx.moveTo(6, 6);
        ctx.lineTo(58, 6);
        ctx.lineTo(58, 40);
        ctx.quadraticCurveTo(58, 62, 32, 68);
        ctx.quadraticCurveTo(6, 62, 6, 40);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#0b0e17';
        ctx.font = 'bold 34px "Yu Gothic", Meiryo, "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('警', 32, 34);
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    function animateSmoker(c, ember, { isBalcony = false, period = 7.5, phase = 0 } = {}) {
      const p = c.userData.parts;
      const baseUpdate = c.userData.update;

      // Resting pose angles:
      // On balcony: elbows resting relaxed on railing, bent ~90 deg, hands towards rail
      // Seated in alley: right hand resting relaxed on right knee/thigh
      const restUpperX = isBalcony ? -0.52 : -0.35;
      const restUpperZ = isBalcony ? 0.16 : -0.10;
      const restForeX = isBalcony ? -1.52 : -0.85;

      // Smoking puff angles: forearm smoothly raises cigarette ember to mouth
      const smokeUpperX = isBalcony ? -0.62 : -0.65;
      const smokeUpperZ = isBalcony ? 0.18 : 0.14;
      const smokeForeX = -2.15;

      const baseHeadPitch = c.userData.headPitch || 0;
      const baseHeadYaw = c.userData.headYaw || 0;
      const citizenPhase = c.userData.phase || phase;

      const smooth = (x) => x * x * (3 - 2 * x);

      c.userData.update = (time) => {
        if (baseUpdate) baseUpdate(time);

        const t = (time + phase) % period;
        let lift = 0;
        let emberDrag = 0.35;
        let puffPitch = 0;

        if (t < 3.2) {
          lift = 0;
          emberDrag = 0.35;
        } else if (t < 4.1) {
          const u = smooth((t - 3.2) / 0.9);
          lift = u;
          emberDrag = 0.35 + u * 0.45;
        } else if (t < 5.4) {
          lift = 1.0;
          const dragPulse = Math.sin((t - 4.1) * 3.5);
          emberDrag = 0.9 + 0.25 * Math.max(0, dragPulse);
          // Strictly non-accumulating natural tilt during puff
          puffPitch = 0.06 * Math.sin(((t - 4.1) / 1.3) * Math.PI);
        } else if (t < 6.2) {
          const u = smooth((t - 5.4) / 0.8);
          lift = 1.0 - u;
          emberDrag = 0.75 - u * 0.4;
        } else {
          lift = 0;
          emberDrag = 0.35;
        }

        p.armR.upper.rotation.x = restUpperX + (smokeUpperX - restUpperX) * lift;
        p.armR.upper.rotation.z = restUpperZ + (smokeUpperZ - restUpperZ) * lift;
        p.armR.fore.rotation.x = restForeX + (smokeForeX - restForeX) * lift;

        // Bounded, non-accumulating head rotation (no flipping or spinning!)
        p.head.rotation.x = Math.sin(time * 0.55 + citizenPhase) * 0.04 + baseHeadPitch + puffPitch;
        p.head.rotation.y = Math.sin(time * 0.4 + citizenPhase) * 0.15 + baseHeadYaw;

        if (ember && ember.material) {
          ember.material.color.setRGB(1.0 * emberDrag, 0.42 * emberDrag, 0.02 * emberDrag);
        }
      };
    }

    function makeSatDish(R) {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: 0x9aa7b8, roughness: 0.35, metalness: 0.7, side: THREE.DoubleSide
      });
      const tMax = 0.7;
      const Rs = R / Math.sin(tMax);
      const geo = new THREE.SphereGeometry(Rs, 28, 8, 0, Math.PI * 2, Math.PI - tMax, tMax);
      geo.translate(0, Rs, 0); // полюс чаши в начале координат, чаша открыта вверх
      const dish = new THREE.Mesh(geo, mat);
      dish.castShadow = true;
      const depth = Rs * (1 - Math.cos(tMax));

      const back = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.045, 0.22, 8), MAT.metalPipe);
      back.position.y = -0.11;

      // Вынесенный облучатель: штанга от нижнего края чаши к фокусу над центром
      const rim = new THREE.Vector3(0, depth, -R);
      const focus = new THREE.Vector3(0, depth + R * 0.75, R * 0.15);
      const dir = focus.clone().sub(rim);
      const len = dir.length();
      dir.normalize();
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, len, 6), MAT.metalPipe);
      arm.position.copy(rim.clone().add(focus).multiplyScalar(0.5));
      arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const lnb = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.09, 10), MAT.metalPipe);
      lnb.position.copy(focus);
      lnb.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(0, depth, 0).sub(focus).normalize()
      );
      g.add(dish, back, arm, lnb);
      return g;
    }

      mast.position.y = 0.65;

      // [радиус, высота на мачте, поворот, наклон к небу]
      [[0.46, 0.95, 0.9, 1.0], [0.3, 0.55, -0.9, 0.9], [0.22, 1.2, 2.3, 1.1]].forEach(([R, y, yaw, tilt]) => {
        const dish = makeSatDish(R);
        dish.rotation.order = 'YXZ';
        dish.rotation.y = yaw;
        dish.rotation.x = tilt;
        const off = 0.1 + R * 0.45;
        dish.position.set(Math.sin(yaw) * off, y, Math.cos(yaw) * off);
        const from = new THREE.Vector3(0, y - 0.05, 0);
        const to = dish.position.clone();
        const d = to.clone().sub(from);
        const link = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, d.length(), 6), MAT.metalPipe);
        link.position.copy(from.clone().add(to).multiplyScalar(0.5));
        link.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
        g.add(dish, link);
      });

    }

    // ============================================================
    // Spatial Audio System: procedural lightning/thunder, drone acoustics, neon coil hum, culinary hiss, speeder Doppler pass-by
    // ============================================================
    let audioExtras = null;
    let audioCtx = null;
    let masterGain = null;
    let audioOn = false;
    let nextThunderAt = 6;
    let lightningFlash = 0;
    let lightningStart = -10;
    const HEMI_BASE = hemiLight.intensity;
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const _camDir = new THREE.Vector3();

    function makeNoiseBuffer(ctx, seconds) {
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }

    function setPannerPos(p, x, y, z) {
      if (p.positionX) {
        p.positionX.value = x;
        p.positionY.value = y;
        p.positionZ.value = z;
      } else {
        p.setPosition(x, y, z);
      }
    }

    function makePanner(ctx, x, y, z, refDistance) {
      const p = ctx.createPanner();
      p.panningModel = 'equalpower';
      p.distanceModel = 'inverse';
      p.refDistance = refDistance;
      p.rolloffFactor = 1.1;
      setPannerPos(p, x, y, z);
      return p;
    }

    function buildAudioExtras() {
      const ctx = audioCtx;
      const noise = makeNoiseBuffer(ctx, 3);
      audioExtras = { noise, drones: [], speeders: [] };

      // Drone acoustic signature: filtered sawtooth carrier with modulated sine whine
      [drone1, drone2].forEach((d, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = 210 + i * 23;
        const whine = ctx.createOscillator();
        whine.type = 'sine';
        whine.frequency.value = 1150 + i * 110;
        const whineGain = ctx.createGain();
        whineGain.gain.value = 0.015;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 900;
        const g = ctx.createGain();
        g.gain.value = 0.14;
        const p = makePanner(ctx, 0, 3, 0, 8);
        p.rolloffFactor = 0.7;
        osc.connect(lp);
        whine.connect(whineGain);
        whineGain.connect(lp);
        lp.connect(g);
        g.connect(p);
        p.connect(masterGain);
        osc.start();
        whine.start();
        audioExtras.drones.push({ obj: d, panner: p });
      });

      // Speeder Doppler acoustics: bandpassed noise attenuation by proximity
      [speeder1, speeder2, speeder3].forEach((s, i) => {
        const src = ctx.createBufferSource();
        src.buffer = noise;
        src.loop = true;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 700 + i * 300;
        bp.Q.value = 0.7;
        const g = ctx.createGain();
        g.gain.value = 0;
        const p = makePanner(ctx, 0, 0, 0, 8);
        src.connect(bp);
        bp.connect(g);
        g.connect(p);
        p.connect(masterGain);
        src.start();
        audioExtras.speeders.push({ obj: s, gain: g, panner: p });
      });

      // High-voltage ballast hum for primary neon signs («ラーメン» and «荒坂»)
      const hum = ctx.createOscillator();
      hum.type = 'sawtooth';
      hum.frequency.value = 100;
      const humLp = ctx.createBiquadFilter();
      humLp.type = 'lowpass';
      humLp.frequency.value = 280;
      const humGain = ctx.createGain();
      humGain.gain.value = 0.012;
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 6.3;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.006;
      lfo.connect(lfoGain);
      lfoGain.connect(humGain.gain);
      hum.connect(humLp);
      humLp.connect(humGain);
      [[-4.8, 2.8, -0.2], [4.8, 6.4, -1.4]].forEach(([x, y, z]) => {
        const p = makePanner(ctx, x, y, z, 3);
        humGain.connect(p);
        p.connect(masterGain);
      });
      hum.start();
      lfo.start();

      // Broth boiling acoustic emitter: high-frequency modulated noise
      const sz = ctx.createBufferSource();
      sz.buffer = noise;
      sz.loop = true;
      const szBp = ctx.createBiquadFilter();
      szBp.type = 'bandpass';
      szBp.frequency.value = 5200;
      szBp.Q.value = 0.8;
      const szGain = ctx.createGain();
      szGain.gain.value = 0.02;
      const szLfo = ctx.createOscillator();
      szLfo.frequency.value = 3.1;
      const szLfoGain = ctx.createGain();
      szLfoGain.gain.value = 0.012;
      szLfo.connect(szLfoGain);
      szLfoGain.connect(szGain.gain);
      const szPan = makePanner(ctx, -4.8, 1.2, -0.6, 2.5);
      sz.connect(szBp);
      szBp.connect(szGain);
      szGain.connect(szPan);
      szPan.connect(masterGain);
      sz.start();
      szLfo.start();
    }

    function playThunder() {
      if (!audioCtx || !audioOn || !audioExtras) return;
      const ctx = audioCtx;
      const now = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = audioExtras.noise;
      src.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(900, now);
      lp.frequency.exponentialRampToValueAtTime(70, now + 3.2);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.55, now + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + 4.0);
      src.connect(lp);
      lp.connect(g);
      g.connect(masterGain);
      src.start(now, Math.random() * 1.5, 4.2);
    }

    function updateLightning(time, delta) {
      if (time > nextThunderAt) {
        nextThunderAt = time + 14 + Math.random() * 22;
        if (!REDUCED_MOTION) lightningStart = time;
        setTimeout(playThunder, 500 + Math.random() * 1500);
      }
      const age = time - lightningStart;
      let flash = 0;
      if (age >= 0 && age < 2) {
        flash = Math.exp(-age * 4.5) + (age > 0.25 ? 0.7 * Math.exp(-(age - 0.25) * 4.5) : 0);
      }
      hemiLight.intensity = HEMI_BASE + flash * 2.4;
    }

    function updateAudio3D(cam) {
      if (!audioCtx || !audioExtras) return;
      const L = audioCtx.listener;
      const p = cam.position;
      cam.getWorldDirection(_camDir);
      if (L.positionX) {
        L.positionX.value = p.x;
        L.positionY.value = p.y;
        L.positionZ.value = p.z;
        L.forwardX.value = _camDir.x;
        L.forwardY.value = _camDir.y;
        L.forwardZ.value = _camDir.z;
        L.upX.value = 0;
        L.upY.value = 1;
        L.upZ.value = 0;
      } else {
        L.setPosition(p.x, p.y, p.z);
        L.setOrientation(_camDir.x, _camDir.y, _camDir.z, 0, 1, 0);
      }
      audioExtras.drones.forEach(({ obj, panner }) => {
        setPannerPos(panner, obj.position.x, obj.position.y, obj.position.z);
      });
      audioExtras.speeders.forEach(({ obj, gain, panner }) => {
        setPannerPos(panner, obj.position.x, obj.position.y, obj.position.z);
        const level = 0.55 * Math.exp(-Math.pow(obj.position.x / 9, 2));
        gain.gain.setTargetAtTime(level, audioCtx.currentTime, 0.1);
      });
    }

    // Ground contact glow decal (low-cost rasterization fallback for point lights)
    function glowDecal(parent, x, z, size, colorHex, opacity, y = 0.012) {

    // Steam / exhaust particle simulation with additive blend and bloom clamping
    function createSteamEmitter(pos, { count = 26, height = 2.4, spread = 0.22, size = 0.9, color = 0x9fb4ff } = {}) {
      const geo = new THREE.BufferGeometry();
      const posArr = new Float32Array(count * 3);
      const colArr = new Float32Array(count * 3);
      const data = [];
      for (let i = 0; i < count; i++) {
        data.push({
          age: Math.random(),
          speed: 0.2 + Math.random() * 0.2,
          ox: (Math.random() - 0.5) * spread,
          oz: (Math.random() - 0.5) * spread,
          ph: Math.random() * 6
        });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
      const mat = new THREE.PointsMaterial({
        map: getGlowTex(),
        size,
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const points = new THREE.Points(geo, mat);
      points.position.copy(pos);
      points.frustumCulled = false;
      islandGroup.add(points);

      const base = new THREE.Color(color).multiplyScalar(0.3);
      const emitter = {
        points,
        update(dt) {
          for (let i = 0; i < count; i++) {
            const d = data[i];
            d.age += dt * d.speed;
            if (d.age > 1) d.age -= 1;
            const a = d.age;
            posArr[i * 3] = d.ox + Math.sin(a * 3 + d.ph) * spread * a * 4;
            posArr[i * 3 + 1] = a * height;
            posArr[i * 3 + 2] = d.oz;
            const fade = Math.sin(Math.PI * a); // Bell-curve alpha attenuation
            colArr[i * 3] = base.r * fade;
            colArr[i * 3 + 1] = base.g * fade;
            colArr[i * 3 + 2] = base.b * fade;
          }
          geo.attributes.position.needsUpdate = true;
          geo.attributes.color.needsUpdate = true;
        }
      };
      steamEmitters.push(emitter);
      return emitter;
    }

    function getConeFadeTex() {
      if (!_coneTex) {
        const c = document.createElement('canvas');
        c.width = 4;
        c.height = 64;
        const ctx = c.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 64);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(1, '#000000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 4, 64);
        _coneTex = new THREE.CanvasTexture(c);
      }
      return _coneTex;

    function makeLightCone(parent, x, topY, z, { radius = 0.7, height = 1.9, color = 0xffb703, opacity = 0.09 } = {}) {
      const grp = new THREE.Group();
      const meshes = [];
      [[1.0, 0.45], [0.66, 0.35], [0.36, 0.3]].forEach(([rk, ok]) => {
        const mat = new THREE.MeshBasicMaterial({
          map: getConeFadeTex(), color, transparent: true, opacity: opacity * ok,
          blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
          toneMapped: false, fog: false
        });
        const cone = new THREE.Mesh(new THREE.ConeGeometry(radius * rk, height, 24, 1, true), mat);
        meshes.push({ mat, k: ok });
        grp.add(cone);
      });
      grp.position.set(x, topY - height / 2, z);
      grp.userData.setOpacity = (v) => meshes.forEach(({ mat, k }) => { mat.opacity = v * k; });
      parent.add(grp);
      return grp;
    }

    function creepyFlicker(t, seed = 0) {
      const cycle = 6.3 + seed * 1.7;
      const p = (t + seed * 2.3) % cycle;
      if (p < 0.10) return 0.1;
      if (p < 0.22) return 1;
      if (p < 0.31) return 0.15;
      if (p < 0.42) return 1;
      if (p < 0.52) return 0.1;
      if (p > cycle - 1.2 && p < cycle - 0.2 && Math.floor(t) % 3 === 0) return 0.2;
      return 0.9 + 0.1 * Math.sin(t * 13.0);
    }

    function addFlickerLamp(parent, x, y, z, { decalX = x, decalZ = z - 1.0, color = 0xffb703, decalColor = 0xffa63d, seed = 0 } = {}) {
      const housing = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.2), MAT.metalPipe);
      housing.position.set(x, y, z);
      parent.add(housing);
      const lensMat = new THREE.MeshBasicMaterial({ color, toneMapped: false });
      const lens = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.14), lensMat);
      lens.position.set(x, y - 0.07, z);
      parent.add(lens);
      const decal = glowDecal(parent, decalX, decalZ, 4.6, decalColor, 0.85);
      const cone = makeLightCone(parent, x, y - 0.08, z - 0.4, { radius: 0.8, height: y - 0.08, color, opacity: 0.1 });

      const onColor = new THREE.Color(color);
      const offColor = onColor.clone().multiplyScalar(0.18);
      propUpdates.push((t) => {
        const f = creepyFlicker(t, seed);
        lensMat.color.copy(offColor).lerp(onColor, f);
        decal.material.opacity = 0.85 * f;
        cone.userData.setOpacity(0.1 * f);
      });
    }

    // Звон разбитого стекла: шумовой удар + несколько высоких коротких «звонков». Только если звук включён.
    function playGlassBreak(pos) {
      if (!audioCtx || !audioOn || !audioExtras) return;
      const ctx = audioCtx;
      const now = ctx.currentTime;
      const pan = makePanner(ctx, pos.x, pos.y, pos.z, 3);
      pan.connect(masterGain);
      const src = ctx.createBufferSource();
      src.buffer = audioExtras.noise;
      src.loop = true;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 2500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.5, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      src.connect(hp);
      hp.connect(g);
      g.connect(pan);
      src.start(now, Math.random() * 1.5, 0.3);
      for (let i = 0; i < 7; i++) {
        const t0 = now + 0.03 + i * 0.045 + Math.random() * 0.03;
        const o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = 2200 + Math.random() * 3800;
        const og = ctx.createGain();
        og.gain.setValueAtTime(0, t0);
        og.gain.linearRampToValueAtTime(0.08, t0 + 0.004);
        og.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.22);
        o.connect(og);
        og.connect(pan);
        o.start(t0);
        o.stop(t0 + 0.25);
      }
    }

    function setupCatScene(hotel) {
      const lid = new THREE.Vector3(-0.5, 0.96, -2.7);
      const behind = new THREE.Vector3(-0.9, 0.0, -3.75);
      const cat = createCatV2();
      cat.position.copy(lid);
      cat.rotation.y = 0.5;
      hotel.add(cat);
      citizens.push(cat);
      const { body, head, tail, eyes } = cat.userData.parts;

      // Миска с молоком на крышке перед котом
      const bowl = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.045, 0.035, 12),
        new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.5 })
      );
      bowl.position.set(-0.37, 0.98, -2.45);
      const milk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 0.005, 12),
        new THREE.MeshBasicMaterial({ color: 0xf8fafc, toneMapped: false })
      );
      milk.position.set(-0.37, 1.0, -2.45);
      hotel.add(bowl, milk);

      // Бутылка и осколки
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x1f7a3a, emissive: 0x0b3a1a, roughness: 0.2, metalness: 0.1 });
      const bottle = new THREE.Group();
      bottle.add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.16, 8), glassMat));
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.025, 0.09, 8), glassMat);
      neck.position.y = 0.125;
      bottle.add(neck);
      bottle.visible = false;
      bottle.traverse((m) => { m.userData.noMerge = true; });
      hotel.add(bottle);

      const shards = [];
      for (let i = 0; i < 14; i++) {
        const s = new THREE.Mesh(new THREE.TetrahedronGeometry(0.02 + Math.random() * 0.02), glassMat);
        s.visible = false;
        s.userData.noMerge = true;
        hotel.add(s);
        shards.push({ mesh: s, v: new THREE.Vector3(), life: 0 });
      }

      const from = new THREE.Vector3(-0.4, 3.15, -1.95); // тёплое окно на задней стене отеля
      const to = new THREE.Vector3(-0.95, 0.99, -3.05);  // крышка контейнера
      const T = 0.7;
      const G = 9.8;
      const vx = (to.x - from.x) / T;
      const vz = (to.z - from.z) / T;
      const vy = (to.y - from.y + 0.5 * G * T * T) / T;

      let state = 'sit';
      let stateT = 0;
      let nextEvent = 28;
      let bottleT = -1;
      let impactDone = false;
      let reactAt = -1;
      let goneFor = 20;
      let puff = 1;
      let lastT = null;
      const smooth = (x) => x * x * (3 - 2 * x);
      const arc = (a, b, u, h) => {
        cat.position.set(
          a.x + (b.x - a.x) * u,
          a.y + (b.y - a.y) * u + h * 4 * u * (1 - u),
          a.z + (b.z - a.z) * u
        );
      };
      const facing = (a, b) => Math.atan2(b.x - a.x, b.z - a.z);

      const idle = (t) => {
        tail.rotation.y = Math.sin(t * 1.4) * 0.5;
        const blink = t % 5 < 0.12 ? 0.1 : 1;
        eyes.forEach((e) => (e.scale.y = blink));
        // Иногда ест из миски: голова вниз, лёгкое жевание
        const cyc = t % 16;
        const k = cyc > 11 && cyc < 14.5 ? smooth(Math.min(1, Math.min(cyc - 11, 14.5 - cyc) / 0.6)) : 0;
        head.rotation.y = Math.sin(t * 0.35) * 0.5 * (1 - k);
        head.rotation.x = 0.9 * k + Math.sin(t * 12) * 0.05 * k;
        head.position.set(0, 0.34 - 0.1 * k, 0.1 * k);
      };

      cat.userData.update = (t) => {
        const dt = lastT === null ? 0 : Math.min(0.1, t - lastT);
        lastT = t;

        // --- Бутылка ---
        if (bottleT < 0 && state === 'sit' && t >= nextEvent) {
          bottleT = t;
          impactDone = false;
          bottle.visible = true;
        }
        if (bottleT >= 0) {
          const u = t - bottleT;
          if (u < T) {
            bottle.position.set(from.x + vx * u, from.y + vy * u - 0.5 * G * u * u, from.z + vz * u);
            bottle.rotation.set(u * 9, 0, u * 6);
          } else if (!impactDone) {
            impactDone = true;
            bottle.visible = false;
            shards.forEach((s) => {
              s.mesh.position.copy(to);
              s.mesh.visible = true;
              s.mesh.scale.setScalar(1);
              s.v.set((Math.random() - 0.5) * 2.4, 0.8 + Math.random() * 1.6, (Math.random() - 0.5) * 2.4);
              s.life = 0;
            });
            playGlassBreak(hotel.localToWorld(to.clone()));
            reactAt = t + 0.12;
          }
        }
        // --- Осколки: падают, отскакивают, через пару секунд тают ---
        shards.forEach((s) => {
          if (!s.mesh.visible) return;
          s.v.y -= G * dt;
          s.mesh.position.addScaledVector(s.v, dt);
          s.mesh.rotation.x += dt * 5;
          s.mesh.rotation.z += dt * 3;
          const p = s.mesh.position;
          const onLid = p.x > -1.6 && p.x < -0.2 && p.z > -3.15 && p.z < -2.45;
          const floor = onLid ? 0.97 : 0.02;
          if (p.y < floor) {
            p.y = floor;
            s.v.y *= -0.3;
            s.v.x *= 0.6;
            s.v.z *= 0.6;
          }
          s.life += dt;
          if (s.life > 2) {
            const k = Math.max(0, 1 - (s.life - 2) / 2.5);
            s.mesh.scale.setScalar(k);
            if (k <= 0.01) s.mesh.visible = false;
          }
        });

        // --- Кот ---
        if (state === 'sit') {
          idle(t);
          if (reactAt > 0 && t >= reactAt) { state = 'startle'; stateT = t; reactAt = -1; }
        } else if (state === 'startle') {
          const u = Math.min(1, (t - stateT) / 0.35);
          puff = 1 + 0.3 * smooth(Math.min(1, u / 0.3)); // шерсть дыбом
          cat.scale.setScalar(puff);
          body.scale.set(0.9, 1.25 + 0.15 * u, 0.9);
          tail.scale.set(1.8, 1.8, 1);
          tail.rotation.x = -0.9 * u;
          head.rotation.set(-0.3, 0, 0);
          if (u >= 1) { state = 'jump'; stateT = t; }
        } else if (state === 'jump') {
          const u = Math.min(1, (t - stateT) / 0.55);
          arc(lid, behind, u, 0.4);
          cat.rotation.y = facing(lid, behind);
          if (u >= 1) { state = 'vanish'; stateT = t; }
        } else if (state === 'vanish') {
          const u = Math.min(1, (t - stateT) / 0.3);
          cat.scale.setScalar(Math.max(0.001, puff * (1 - u)));
          if (u >= 1) {
            cat.visible = false;
            state = 'gone';
            stateT = t;
            goneFor = 18 + Math.random() * 14;
          }
        } else if (state === 'gone') {
          if (t - stateT > goneFor) {
            state = 'return';
            stateT = t;
            cat.position.copy(behind);
            cat.rotation.y = facing(behind, lid);
            cat.scale.setScalar(0.01);
            cat.visible = true;
            body.scale.set(1, 1.25, 1); // шерсть снова обычная
            tail.scale.set(1, 1, 1);
            tail.rotation.x = 0;
            head.rotation.set(0, 0, 0);
            head.position.set(0, 0.34, 0);
          }
        } else if (state === 'return') {
          const u = t - stateT;
          if (u < 0.3) {
            cat.scale.setScalar(Math.max(0.01, smooth(u / 0.3)));
          } else if (u < 0.9) {
            cat.scale.setScalar(1);
          } else if (u < 1.45) {
            arc(behind, lid, (u - 0.9) / 0.55, 0.45);
          } else {
            cat.position.copy(lid);
            cat.rotation.y = 0.5;
            state = 'sit';

    function wire(a, b, sag = 0.5, r = 0.018) {
      const pts = [];
      for (let i = 0; i <= 6; i++) {
        const t = i / 6;
        const p = new THREE.Vector3().lerpVectors(a, b, t);
        p.y -= Math.sin(Math.PI * t) * sag;
        pts.push(p);

      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, r, 5, false),
        new THREE.MeshStandardMaterial({ color: 0x0b0c12, roughness: 0.6, metalness: 0.3 })
      );
      islandGroup.add(mesh);

    function createBillboardTexture() {
      const w = 1024;
      const h = 572;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      const font = '"Segoe UI", Meiryo, "Hiragino Sans", "Yu Gothic", sans-serif';

      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, '#12062e');
      bg.addColorStop(1, '#3a0a52');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Diagonal neon accent striping
      ctx.globalAlpha = 0.25;
      ['#00f3ff', '#ff007f'].forEach((col, i) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(560 + i * 140, 0);
        ctx.lineTo(640 + i * 140, 0);
        ctx.lineTo(360 + i * 140, h);
        ctx.lineTo(280 + i * 140, h);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Cylindrical beverage can illustration
      const rr = (x, y, ww, hh, r) => {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + ww, y, x + ww, y + hh, r);
        ctx.arcTo(x + ww, y + hh, x, y + hh, r);
        ctx.arcTo(x, y + hh, x, y, r);
        ctx.arcTo(x, y, x + ww, y, r);
        ctx.closePath();
      };
      const cg = ctx.createLinearGradient(80, 0, 260, 0);
      cg.addColorStop(0, '#ff1744');
      cg.addColorStop(0.5, '#ff6b81');
      cg.addColorStop(1, '#a00f2e');
      rr(80, 80, 180, 410, 28);
      ctx.fillStyle = cg;
      ctx.fill();
      ctx.save();
      rr(80, 80, 180, 410, 28);
      ctx.clip();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(60, 300);
      ctx.quadraticCurveTo(170, 230, 290, 300);
      ctx.lineTo(290, 340);
      ctx.quadraticCurveTo(170, 270, 60, 340);
      ctx.fill();
      ctx.restore();

      const neon = (text, x, y, size, color, core) => {
        ctx.font = `bold ${size}px ${font}`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 36;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 14;
        ctx.fillText(text, x, y);
        ctx.fillStyle = core;
        ctx.shadowBlur = 5;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;
      };
      neon('NEO·KOLA', 310, 210, 130, '#00f3ff', '#ffffff');
      neon('ネオコーラ', 320, 350, 92, '#ff007f', '#fff0f8');
      neon('STAY ELECTRIC', 320, 460, 48, '#ffd166', '#fffbe6');

      ctx.shadowBlur = 24;
      ctx.shadowColor = '#00f3ff';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 8;
      ctx.strokeRect(16, 16, w - 32, h - 32);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function addBillboardNeon(g) {
      const baseColor = new THREE.Color(0xff007f);
      const frameMat = new THREE.MeshBasicMaterial({ color: baseColor.clone(), toneMapped: false });
      const fw = 3.6;
      const fh = 2.1;
      const ft = 0.05;
      [
        [0, fh / 2, fw, ft],
        [0, -fh / 2, fw, ft],
        [-fw / 2, 0, ft, fh],
        [fw / 2, 0, ft, fh]
      ].forEach(([x, y, w, h]) => {
        [0.14, -0.14].forEach((z) => { // Dual-sided display (front and rear)
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), frameMat);
          m.position.set(x, 3.3 + y, z);
          g.add(m);
        });
      });

      // Volumetric backscatter glow halo
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: getGlowTex(), color: 0xff3fa4, transparent: true, opacity: 0.3,
        depthWrite: false, blending: THREE.AdditiveBlending, fog: false
      }));
      halo.scale.set(6.5, 4.2, 1);
      halo.position.set(0, 3.3, -0.35);

      // Frame luminaire modulation and micro-strobe cycle
      propUpdates.push((t) => {
        const flicker = Math.sin(t * 1.3) * Math.sin(t * 7.1) > 0.85 ? 0.35 : 1;
        const f = (0.78 + 0.22 * Math.sin(t * 3.1)) * flicker;
        frameMat.color.copy(baseColor).multiplyScalar(f);
        halo.material.opacity = 0.3 * f;
      });

          ctx.beginPath();

          ctx.lineTo(cx, cy + s);
          ctx.lineTo(cx - s * 0.6, cy);
          ctx.closePath();
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        neon('ICE COLD', w / 2, 200, 150, '#00f3ff', '#ffffff');

      } else {

      ctx.shadowBlur = 24;

      ctx.strokeStyle = '#00f3ff';

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function makeSlideshow(faceMat, textures, period = 7) {
      let current = 0;
      let last = 0;
      faceMat.map = textures[0];
      propUpdates.push((t) => {
        if (t - last > period) {
          current = (current + 1) % textures.length;
          faceMat.map = textures[current];
          last = t;
        }
        const glitch = t - last < 0.2;
        textures.forEach((s) => { s.offset.x = 0; });
        if (glitch) textures[current].offset.x = (Math.random() - 0.5) * 0.05;
        faceMat.color.setScalar(glitch ? 0.8 : 1);
      });
    }

    function addBillboardAnimation(board, g) {
      const faceMat = board.userData.faceMat;
      makeSlideshow(faceMat, [faceMat.map, createBillboardAdTexture(1), createBillboardAdTexture(2)], 6);
    }

    function createKitsuneTexture() {
      const W = 1024;
      const H = 512;
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      const ctx = c.getContext('2d');
      const cx = 256;

      ctx.fillStyle = '#f4f7ff';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 135, 170, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      [-1, 1].forEach((s) => {
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(cx + s * 62, cy + 52 + i * 22);
          ctx.lineTo(cx + s * 128, cy + 30 + i * 32);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(cx + s * 32, cy - 36);
        ctx.quadraticCurveTo(cx + s * 92, cy - 62, cx + s * 126, cy - 112);
        ctx.stroke();
      });
      ctx.fillStyle = '#e11d48';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 150);
      ctx.lineTo(cx + 22, cy - 108);
      ctx.lineTo(cx, cy - 90);
      ctx.lineTo(cx - 22, cy - 108);
      ctx.closePath();
      ctx.fill();
      // Схемы на щеках и лбу (бирюзовые дорожки с узлами)
      ctx.strokeStyle = '#18a8c4';
      ctx.fillStyle = '#18a8c4';
      ctx.lineWidth = 4;
      [-1, 1].forEach((s) => {
        ctx.beginPath();
        ctx.moveTo(cx + s * 40, cy + 100);
        ctx.lineTo(cx + s * 40, cy + 130);
        ctx.lineTo(cx + s * 90, cy + 130);
        ctx.lineTo(cx + s * 90, cy + 90);
        ctx.stroke();
        [[40, 100], [90, 90], [90, 130]].forEach(([dx, dy]) => {
          ctx.beginPath();
          ctx.arc(cx + s * dx, cy + dy, 6, 0, Math.PI * 2);
          ctx.fill();
        });
      });
      ctx.beginPath();
      ctx.moveTo(cx - 50, cy - 130);
      ctx.lineTo(cx - 50, cy - 110);
      ctx.lineTo(cx + 50, cy - 110);
      ctx.lineTo(cx + 50, cy - 130);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(0, 40, 80, 0.22)';
      for (let y = 0; y < H; y += 6) ctx.fillRect(0, y, W, 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;

    function createBusPosterTexture(variant) {
      const w = 512;
      const h = 768;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      const font = '"Segoe UI", Meiryo, "Hiragino Sans", "Yu Gothic", sans-serif';
      const neon = (text, x, y, size, color, core) => {
        ctx.font = 'bold ' + size + 'px ' + font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 30;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 12;
        ctx.fillText(text, x, y);
        ctx.fillStyle = core;
        ctx.shadowBlur = 4;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;
      };
      const bg = ctx.createLinearGradient(0, 0, w, h);

      if (variant === 0) {
        bg.addColorStop(0, '#0b1030');
        bg.addColorStop(1, '#2b0a4a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        neon('NEURO', w / 2, 210, 120, '#00f3ff', '#ffffff');
        neon('LINK', w / 2, 330, 120, '#ff007f', '#fff0f8');
        neon('脳内高速化', w / 2, 470, 70, '#ffd166', '#fffbe6');
        neon('UPGRADE YOUR MIND', w / 2, 580, 38, '#00f3ff', '#ffffff');
      } else if (variant === 1) {
        bg.addColorStop(0, '#2a0a0a');
        bg.addColorStop(1, '#4a0a22');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        neon('義手', w / 2, 220, 190, '#ff1744', '#ffffff');
        neon('-30%', w / 2, 410, 140, '#ffd166', '#fffbe6');
        neon('CYBER ARM SALE', w / 2, 560, 46, '#00f3ff', '#ffffff');
      } else {
        bg.addColorStop(0, '#06121c');
        bg.addColorStop(1, '#0a2a2a');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        neon('LOST CAT', w / 2, 140, 100, '#7dff6b', '#f0fff0');
        neon('黒猫を探しています', w / 2, 250, 46, '#ffd166', '#fffbe6');
        // Black cat silhouette with bioluminescent green eyes
        ctx.fillStyle = '#05060a';
        ctx.beginPath();
        ctx.ellipse(w / 2, 420, 105, 90, 0, 0, Math.PI * 2);
        ctx.fill();
        [-1, 1].forEach((s) => {
          ctx.beginPath();
          ctx.moveTo(w / 2 + s * 40, 345);
          ctx.lineTo(w / 2 + s * 100, 290);
          ctx.lineTo(w / 2 + s * 100, 380);
          ctx.closePath();
          ctx.fill();
        });
        ctx.fillStyle = '#7dff6b';
        ctx.shadowColor = '#7dff6b';
        ctx.shadowBlur = 24;
        [-1, 1].forEach((s) => {
          ctx.beginPath();
          ctx.ellipse(w / 2 + s * 42, 415, 17, 11, 0, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.shadowBlur = 0;
        neon('REWARD 500¥', w / 2, 600, 58, '#ff007f', '#fff0f8');
      }

      ctx.shadowBlur = 20;
      ctx.shadowColor = '#00f3ff';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 8;
      ctx.strokeRect(14, 14, w - 28, h - 28);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function puffCurve(t) {
      const c = t % 6.0; // Inhalation cycle (6s periodicity: elevate, hold, depress)
      const k = c < 0.7 ? c / 0.7 : c < 1.6 ? 1 : c < 2.3 ? 1 - (c - 1.6) / 0.7 : 0;
      return k * k * (3 - 2 * k);
    }

    // Arm joint orientation in global sagittal angles (psi1: upper arm pitch, psi2: forearm pitch)
    function setArmPose(p, side, psi1, psi2, lateral = 0) {
      const arm = side === 'L' ? p.armL : p.armR;
      const th = p.body ? p.body.rotation.x : 0;
      arm.upper.rotation.set(-psi1 - th, 0, lateral);
      arm.fore.rotation.x = psi1 - psi2;
    }

    const _ikDown = new THREE.Vector3(0, -1, 0);

    // Two-bone analytical inverse kinematics (IK) solver with elbow pole-vector constraint
    function solveArmIK(arm, target, pole) {
      const S = arm.upper.position;
      const L1 = arm.upper.userData.total;
      const L2 = arm.fore.userData.total;
      const st = target.clone().sub(S);
      let d = st.length();
      d = Math.min(Math.max(d, Math.abs(L1 - L2) + 1e-3), L1 + L2 - 1e-3);
      st.normalize();
      const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
      const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
      const pr = pole.clone().sub(st.clone().multiplyScalar(pole.dot(st))).normalize();
      const elbow = S.clone().add(st.clone().multiplyScalar(L1 * cosA)).add(pr.multiplyScalar(L1 * sinA));
      const hand = S.clone().add(st.clone().multiplyScalar(d));
      arm.upper.quaternion.setFromUnitVectors(_ikDown, elbow.clone().sub(S).normalize());
      const foreDir = hand.clone().sub(elbow).normalize();
      foreDir.applyQuaternion(arm.upper.quaternion.clone().invert());
      arm.fore.quaternion.setFromUnitVectors(_ikDown, foreDir);
    }

    // Procedural smoking kinematics: cigarette grip, ember glow modulation, thin rising trail, and exhaled vapor
    function setupSmokingIK(c, rest) {
      const p = c.userData.parts;
      const { cig, ember } = attachCigarette(c, 'R');

      // Compute rest hand target position once via forward kinematics
      setArmPose(p, 'R', rest.psi1, rest.psi2, 0.1);
      c.updateWorldMatrix(true, true);
      const restTarget = new THREE.Vector3(0, -p.armR.fore.userData.total, 0);
      p.armR.fore.localToWorld(restTarget);
      p.body.worldToLocal(restTarget);

      const smoke = createSteamEmitter(new THREE.Vector3(), {
        count: 10, height: 0.9, spread: 0.08, size: 0.28, color: 0xcbd5e1
      });
      followWithSmoke(ember, smoke);
      const exhale = createSteamEmitter(new THREE.Vector3(), {
        count: 14, height: 0.9, spread: 0.1, size: 0.5, color: 0xe2e8f0
      });
      exhale.points.material.opacity = 0;

      const mouth = new THREE.Vector3();
      const target = new THREE.Vector3();
      const pole = new THREE.Vector3();
      const outward = new THREE.Vector3(0.35, 0, 0);
      const fwd = new THREE.Vector3();
      const qFore = new THREE.Quaternion();
      const world = new THREE.Vector3();
      const base = c.userData.update;

      c.userData.update = (t) => {
        base(t);
        const e = puffCurve(t);

        // Oral target in local body space
        mouth.set(0, -0.075, 0.15).applyQuaternion(p.head.quaternion).add(p.head.position);
        target.copy(restTarget).lerp(mouth, e);
        pole.copy(_ikDown).applyQuaternion(p.body.quaternion.clone().invert()).add(outward);
        solveArmIK(p.armR, target, pole);
        setArmPose(p, 'L', rest.psi1, rest.psi2, -0.1);

        // Cigarette alignment: parallel to forearm at rest, angled outward during inhale
        fwd.set(0, 0.25, 1).normalize().applyQuaternion(p.head.quaternion);
        qFore.copy(p.armR.upper.quaternion).multiply(p.armR.fore.quaternion).invert();
        fwd.applyQuaternion(qFore);
        const dirLocal = _ikDown.clone().lerp(fwd, e).normalize();
        cig.quaternion.setFromUnitVectors(_ikDown, dirLocal);
        const d = 0.35 + 0.65 * e;
        ember.material.color.setRGB(d, 0.4 * d, 0);

        // Exhale puff: smooth rise and decay at ~1.7s post-inhalation
        const c6 = t % 6.0;
        const ex = c6 > 1.7 && c6 < 3.6 ? Math.sin(((c6 - 1.7) / 1.9) * Math.PI) : 0;
        exhale.points.material.opacity = 0.9 * ex;
        world.copy(mouth);
        p.body.localToWorld(world);
        islandGroup.worldToLocal(world);
        exhale.points.position.copy(world);
      };
    }

    const QUALITY_NAMES = ['LOW', 'MEDIUM', 'HIGH'];

    function setMSAA(on) {
      [composer.renderTarget1, composer.renderTarget2].forEach((rt) => {
        rt.samples = on ? 2 : 0;
        rt.dispose();
      });
    }

    function setQuality(q) {
      quality = q;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;

      if (q === 2) {
        useBloom = true;
        renderer.setPixelRatio(Math.min(dpr, 2));
        shadowEvery = 2;
        setMSAA(true);
      } else if (q === 1) {
        useBloom = true;
        renderer.setPixelRatio(1);
        shadowEvery = 4;
        setMSAA(false);
      } else {
        useBloom = false;
        renderer.setPixelRatio(1);
        shadowEvery = 6;
      }

      renderer.setSize(w, h);
      composer.setPixelRatio(renderer.getPixelRatio());
      composer.setSize(w, h);
    }

      scene.updateMatrixWorld(true);

        if (!o.isMesh || !o.castShadow) return;
        if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
        o.getWorldScale(_ws);
        const r = o.geometry.boundingSphere.radius * Math.max(_ws.x, _ws.y, _ws.z);
        if (r < minRadius) o.castShadow = false;
      });
    }

    // ============================================================
    // NPC WAYPOINT LOCOMOTION & KITCHEN COOK ROAMING SYSTEM
    // ============================================================
    function makeWalker(citizen, waypoints, { speed = 0.6 } = {}) {
      const parts = citizen.userData.parts;
      const baseUpdate = citizen.userData.update;
      let i = 0;
      let waitLeft = waypoints[0].wait || 0;
      let last = null;
      let phase = 0;
      citizen.position.x = waypoints[0].x;
      citizen.position.z = waypoints[0].z;

      const turnTo = (angle, k) => {
        let d = angle - citizen.rotation.y;
        d = Math.atan2(Math.sin(d), Math.cos(d)); // Shortest angular distance
        citizen.rotation.y += d * k;
      };

      citizen.userData.update = (t) => {
        if (baseUpdate) baseUpdate(t); // Thoracic breathing and cervical yaw
        const dt = last === null ? 0 : Math.min(0.1, t - last);
        last = t;

        const wp = waypoints[i];
        const dx = wp.x - citizen.position.x;
        const dz = wp.z - citizen.position.z;
        const dist = Math.hypot(dx, dz);
        let moving = false;

        if (dist > 0.04) {
          moving = true;
          const step = Math.min(dist, speed * dt);
          citizen.position.x += (dx / dist) * step;
          citizen.position.z += (dz / dist) * step;
          turnTo(Math.atan2(dx, dz), Math.min(1, dt * 8));
          phase += step * 7.0; // Gait phase synchronized with ground distance to prevent foot sliding
        } else {
          if (wp.face !== undefined) turnTo(wp.face, Math.min(1, dt * 6));
          waitLeft -= dt;
          if (wp.action) wp.action(t, parts);
          if (waitLeft <= 0) {
            i = (i + 1) % waypoints.length;
            waitLeft = waypoints[i].wait || 0;
          }
        }

        if (moving) {
          if (parts.body) parts.body.rotation.x *= 0.85;
          const s = Math.sin(phase);
          parts.legL.thigh.rotation.x = -s * 0.5;
          parts.legR.thigh.rotation.x = s * 0.5;
          parts.legL.shin.rotation.x = Math.max(0, s) * 0.8;
          parts.legR.shin.rotation.x = Math.max(0, -s) * 0.8;
          parts.armL.upper.rotation.set(s * 0.4, 0, 0.08);
          parts.armR.upper.rotation.set(-s * 0.4, 0, -0.08);
          parts.armL.fore.rotation.x = -0.25;
          parts.armR.fore.rotation.x = -0.25;
        } else {
          [parts.legL, parts.legR].forEach((l) => {
            l.thigh.rotation.x *= 0.85;
            l.shin.rotation.x *= 0.85;
          });
          if (!wp.action) {
            [parts.armL, parts.armR].forEach((a) => {
              a.upper.rotation.x *= 0.85;
              a.fore.rotation.x += (-0.25 - a.fore.rotation.x) * 0.15;
            });
          }
        }
      };
    }

    // ============================================================
    // RESIDENTIAL WINDOW SHADOW SILHOUETTE (PROCEDURAL OCCUPANCY ANIMATION)
    // ============================================================
    function drawSilhouette(ctx, t, mode) {
      ctx.clearRect(0, 0, 128, 128);
      ctx.strokeStyle = '#0a0a10';
      ctx.fillStyle = '#0a0a10';
      ctx.lineCap = 'round';
      ctx.lineWidth = 9;
      const dance = mode === 'dance';
      const sway = dance ? Math.sin(t * 5) : Math.sin(t * 0.8) * 0.2;
      const beat = dance ? Math.sin(t * 10) : 0;
      const neck = { x: 64 + sway * 6, y: 46 };
      const hip = { x: 64 - sway * 6, y: 82 + Math.abs(beat) * 4 };

      ctx.beginPath();
      ctx.arc(neck.x, 33 + Math.abs(beat) * 2, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(neck.x, neck.y);
      ctx.lineTo(hip.x, hip.y);
      ctx.stroke();

      const handL = dance ? { x: neck.x - 30, y: 22 + sway * 16 } : { x: neck.x - 14, y: 76 };
      const handR = dance ? { x: neck.x + 30, y: 22 - sway * 16 } : { x: neck.x + 14, y: 76 };
      [handL, handR].forEach((h) => {
        ctx.beginPath();
        ctx.moveTo(neck.x, neck.y + 4);
        ctx.lineTo(h.x, h.y);
        ctx.stroke();
      });

      const step = dance ? Math.cos(t * 5) * 10 : 0;
      ctx.beginPath();
      ctx.moveTo(hip.x, hip.y);
      ctx.lineTo(hip.x - 14 + step, 122);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(hip.x, hip.y);
      ctx.lineTo(hip.x + 14 - step, 122);
      ctx.stroke();
    }

    function addWindowSilhouette(parent, x, y, z, w, h, mode = 'dance', rotY = 0) {
