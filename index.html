    // ============================================================
    // RESPONSIVE ASPECT RATIO & DYNAMIC FOV COMPENSATION
    // ============================================================
    function applyResponsiveFov() {
      const a = camera.aspect;
      const wide = 16 / 9;
      if (a >= wide) {
        camera.fov = 36;
      } else {
        const baseH = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(36) / 2) * wide);
        const v = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(baseH / 2) / a));
        camera.fov = Math.min(70, v);
      }
      camera.updateProjectionMatrix();
    }

    // ============================================================
    // STATIC GEOMETRY BATCHING & DRAW-CALL OPTIMIZATION PIPELINE
    // ============================================================
    const MERGE_ENABLED = !location.search.includes('nomerge');
    const _mergeSnaps = [];
    const _mergeTimes = [2.0, 5.0, 9.0];
    let _mergeDone = !MERGE_ENABLED;
    const _mInv = new THREE.Matrix4();
    const _mRel = new THREE.Matrix4();

    function snapshotRelativeMatrices() {
      islandGroup.updateMatrixWorld(true);
      _mInv.copy(islandGroup.matrixWorld).invert();
      const snap = new Map();
      islandGroup.traverse((o) => {
        if (!o.isMesh) return;
        _mRel.multiplyMatrices(_mInv, o.matrixWorld);
        snap.set(o, _mRel.elements.slice());
      });
      return snap;
    }

    function sameMatrix(a, b) {
      for (let i = 0; i < 16; i++) if (Math.abs(a[i] - b[i]) > 1e-5) return false;
      return true;
    }

    function mergeStaticMeshes(snaps) {
      const dynamic = new Set([...citizens, drone1, drone2]);
      const blocked = (o) => {
        for (let p = o; p && p !== islandGroup; p = p.parent) {
          if (dynamic.has(p) || !p.visible) return true;
        }
        return false;
      };

      islandGroup.updateMatrixWorld(true);
      _mInv.copy(islandGroup.matrixWorld).invert();
      const buckets = new Map();

      islandGroup.traverse((o) => {
        if (!o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) return;
        const mat = o.material;
        if (Array.isArray(mat) || mat.transparent || o.userData.noMerge) return;
        if (!o.geometry || !o.geometry.attributes.position || blocked(o)) return;
        const first = snaps[0].get(o);
        if (!first) return;
        for (let s = 1; s < snaps.length; s++) {
          const m = snaps[s].get(o);
          if (!m || !sameMatrix(first, m)) return; // Dynamic transform detected; exclude from merge
        }
        _mRel.multiplyMatrices(_mInv, o.matrixWorld);
        if (_mRel.determinant() < 0) return; // Exclude negatively-scaled / mirrored geometry
        const key = mat.uuid + '|' + o.castShadow + '|' + o.receiveShadow;
        let b = buckets.get(key);
        if (!b) {
          b = { mat, cast: o.castShadow, recv: o.receiveShadow, items: [] };
          buckets.set(key, b);
        }
        b.items.push({ mesh: o, matrix: _mRel.clone() });
      });

      let merged = 0;
      let created = 0;
      buckets.forEach((b) => {
        if (b.items.length < 2) return;
        const geos = b.items.map(({ mesh, matrix }) => {
          const g = mesh.geometry.index ? mesh.geometry.toNonIndexed() : mesh.geometry.clone();
          Object.keys(g.attributes).forEach((n) => {
            if (n !== 'position' && n !== 'normal' && n !== 'uv') g.deleteAttribute(n);
          });
          if (!g.attributes.normal) g.computeVertexNormals();
          if (!g.attributes.uv) {
            g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
          }
          g.clearGroups();
          g.applyMatrix4(matrix);
          return g;
        });
        const geo = mergeGeometries(geos, false);
        geos.forEach((g) => g.dispose());
        if (!geo) return; // Attribute schema mismatch fallback
        const mesh = new THREE.Mesh(geo, b.mat);
        mesh.castShadow = b.cast;
        mesh.receiveShadow = b.recv;
        mesh.matrixAutoUpdate = false;
        islandGroup.add(mesh);
        b.items.forEach(({ mesh: m }) => m.parent.remove(m));
        merged += b.items.length;
        created++;
      });
      console.info('[merge] ' + merged + ' meshes -> ' + created);
    }

    function mergeStep(time) {
      if (_mergeDone) return;
      if (_mergeSnaps.length < _mergeTimes.length) {
        if (time >= _mergeTimes[_mergeSnaps.length]) _mergeSnaps.push(snapshotRelativeMatrices());
      } else if (time >= 11) {
        mergeStaticMeshes(_mergeSnaps);
        _mergeDone = true;
      }
    }

    // ---- NPC Behavioral Animation Controllers ----
    function animateTalking(c, seed = 0) {
      const p = c.userData.parts;
      const base = c.userData.update;
      c.userData.update = (t) => {
        base(t);
        const burst = Math.max(0, Math.sin(t * 0.9 + seed)); // Speech articulation cadence
        const wave = Math.sin(t * 6 + seed * 2) * 0.15 * burst;
        p.armR.upper.rotation.set(-0.5 - 0.7 * burst, 0, -0.15);
        p.armR.fore.rotation.x = -0.5 - 0.6 * burst + wave;
        c.userData.headYaw = Math.sin(t * 0.5 + seed) * 0.3;
      };
    }

    // Interrogation officer note-taking cycle: takes notes, lowers clipboard to listen & nod, resumes writing.
    function animateNotetaker(c) {
      const p = c.userData.parts;
      const base = c.userData.update;
      const book = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.16, 0.015),
        new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.8 })
      );
      book.position.set(0, -p.armL.fore.userData.total, 0);
      p.armL.fore.add(book);
      const penGeo = new THREE.CylinderGeometry(0.006, 0.006, 0.13, 6);
      penGeo.translate(0, -0.065, 0);
      const pen = new THREE.Mesh(penGeo, new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.5 }));
      pen.position.set(0, -p.armR.fore.userData.total, 0);
      p.armR.fore.add(pen);

      const Lrest = new THREE.Vector3(-0.22, 0.02, 0.1);
      const Lwrite = new THREE.Vector3(-0.07, 0.4, 0.25);
      const Rrest = new THREE.Vector3(0.22, 0.02, 0.1);
      const Rwrite = new THREE.Vector3(0.05, 0.38, 0.27);
      const tl = new THREE.Vector3();
      const tr = new THREE.Vector3();
      const poleL = _ikDown.clone().add(new THREE.Vector3(-0.4, 0, 0));
      const poleR = _ikDown.clone().add(new THREE.Vector3(0.4, 0, 0));
      const qBook = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.5, 0, 0));
      const qPen = new THREE.Quaternion().setFromUnitVectors(_ikDown, new THREE.Vector3(0.05, -0.6, 0.8).normalize());
      const foreQ = new THREE.Quaternion();

      c.userData.update = (t) => {
        base(t);
        const cyc = t % 10;
        let k;
        if (cyc < 5.5) k = 1; // пишет
        else if (cyc < 6.3) k = 1 - (cyc - 5.5) / 0.8; // опускает руки
        else if (cyc < 8.5) k = 0; // слушает
        else k = (cyc - 8.5) / 1.5; // поднимает блокнот
        const e = k * k * (3 - 2 * k);

        tl.copy(Lrest).lerp(Lwrite, e);
        tr.copy(Rrest).lerp(Rwrite, e);
        if (e > 0.8) { // ручка водит по странице
          tr.x += Math.sin(t * 9) * 0.025 * e;
          tr.y += Math.sin(t * 6.5 + 1) * 0.012 * e;
        }
        solveArmIK(p.armL, tl, poleL);
        solveArmIK(p.armR, tr, poleR);

        foreQ.copy(p.armL.upper.quaternion).multiply(p.armL.fore.quaternion).invert();
        book.quaternion.copy(foreQ).multiply(qBook);
        foreQ.copy(p.armR.upper.quaternion).multiply(p.armR.fore.quaternion).invert();
        pen.quaternion.copy(foreQ).multiply(qPen);

        c.userData.headPitch = 0.3 * e + (1 - e) * (0.1 + Math.sin(t * 2.2) * 0.08);
      };
    }

    // Victim form: beveled anatomical silhouette under mortuary sheet with procedural folds.
    // Outlined with an emissive cybernetic forensic chalk cordon for silhouette readability.
    function addCoveredBody(x, z, rotY) {
      const g = new THREE.Group();
      g.position.set(x, 0.03, z);
      g.rotation.y = rotY;
      const L = 1.75;
      const w = (s) => {
        if (s < 0.28) return 0.13 * Math.sqrt(Math.max(0, 1 - Math.pow((s - 0.14) / 0.14, 2))); // Cranium
        if (s < 0.36) return 0.07 + (s - 0.28) * 0.9; // Cervical curve
        if (s < 0.48) return 0.14 + (s - 0.36) * 1.1; // Clavicle & shoulders
        if (s < 1.0) return 0.27 - (s - 0.48) * 0.12; // Torso
        if (s < 1.15) return 0.21 + (s - 1.0) * 0.1; // Pelvis
        return Math.max(0.1, 0.225 - (s - 1.15) * 0.2); // Lower extremities
      };
      const N = 48;
      const pts = [];
      for (let i = 0; i <= N; i++) { const s = (i / N) * L; pts.push(new THREE.Vector2(w(s), s)); }
      for (let i = N - 1; i >= 1; i--) { const s = (i / N) * L; pts.push(new THREE.Vector2(-w(s), s)); }
      const geo = new THREE.ExtrudeGeometry(new THREE.Shape(pts), {
        depth: 0.04, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.045, bevelSegments: 4, curveSegments: 8
      });
      geo.rotateX(-Math.PI / 2);
      geo.translate(0, 0.06, L / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) { // Cloth drape creases on upper surface
        if (pos.getY(i) > 0.07) {
          const fx = pos.getX(i);
          const fz = pos.getZ(i);
          pos.setY(i, pos.getY(i) + 0.012 * Math.sin(fx * 38 + fz * 11) + 0.008 * Math.sin(fz * 27 + 1.3));
        }
      }
      geo.computeVertexNormals();
      const sheet = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xd7dce3, roughness: 0.9 }));
      sheet.castShadow = true;
      g.add(sheet);

      // Emissive holographic chalk contour
      const outline = [];
      for (let i = 0; i <= N; i++) { const s = (i / N) * L; outline.push(new THREE.Vector3(w(s) * 1.3 + 0.06, 0.025, L / 2 - s * 1.04)); }
      for (let i = N - 1; i >= 1; i--) { const s = (i / N) * L; outline.push(new THREE.Vector3(-w(s) * 1.3 - 0.06, 0.025, L / 2 - s * 1.04)); }
      const curve = new THREE.CatmullRomCurve3(outline, true);
      const ring = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 160, 0.012, 6, true),
        new THREE.MeshBasicMaterial({ color: 0x00f3ff, toneMapped: false })
      );
      g.add(ring);

      // Footwear protruding from beneath mortuary shroud
      const shoe = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
      [-0.08, 0.08].forEach((sx) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.05, 0.14), shoe);
        m.position.set(sx, 0.045, -L / 2 - 0.03);
        g.add(m);
      });
      islandGroup.add(g);
    }

        setArmPose(p, 'R', 0.15 + 0.7 * e, 0.15 + 1.1 * e, -0.1);
      };
    }

    function setupPhotographer(photographer) {
      const pp = photographer.userData.parts;
      const cam = makeCameraProp();
      cam.position.y = -pp.armR.fore.userData.total;
      pp.armR.fore.add(cam);
      const flashSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: getGlowTex(), color: 0xffffff, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false
      }));
      flashSprite.scale.set(1.0, 1.0, 1);
      flashSprite.position.set(0.05, 0.065, 0.08);
      cam.add(flashSprite);

      let flash = 0;
      let nextFlash = 0;
      let lastT = null;
      const ease = (obj, key, target, k = 0.12) => { obj[key] += (target - obj[key]) * k; };
      const photoAction = (t, p) => {
        ease(p.body.rotation, 'x', 0.1);
        ease(p.armR.upper.rotation, 'x', -1.3);
        ease(p.armR.fore.rotation, 'x', -1.0);
        ease(p.armR.upper.rotation, 'z', -0.2);
        ease(p.armL.upper.rotation, 'x', -1.3);
        ease(p.armL.fore.rotation, 'x', -1.0);
        ease(p.armL.upper.rotation, 'z', 0.45);
        // Discharge strobe once camera achieves ocular alignment
        if (p.armR.upper.rotation.x < -1.2 && t > nextFlash) {
          flash = 1;
          nextFlash = t + 2.2 + Math.random() * 0.8;
        }
      };
      propUpdates.push((t) => {
        const dt = lastT === null ? 0 : Math.min(0.1, t - lastT);
        lastT = t;
        flash = Math.max(0, flash - dt * 6);
        flashSprite.material.opacity = flash;
        cam.rotation.x = -(pp.body.rotation.x + pp.armR.upper.rotation.x + pp.armR.fore.rotation.x);
      });
      const faceBody = -Math.PI / 2;
      makeWalker(photographer, [
        { x: 0.05, z: -0.6, wait: 2.6, face: faceBody, action: photoAction },
        { x: 0.05, z: 0.3, wait: 2.6, face: faceBody, action: photoAction },
        { x: 0.05, z: 1.2, wait: 2.6, face: faceBody, action: photoAction },
        { x: 0.05, z: 0.3, wait: 0.5, face: faceBody }
      ], { speed: 0.7 });
    }

    // Previous mix: music 1.0, rain 0.2, synth 0.022. Set rain to 0 to mute it.
    const audioMix = { music: 1.25, rain: 0.035, synth: 0.022 };
    const musicTrack = new Audio('./assets/audio/Tokyo_Midnight_Rain.mp3');

    function buildAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();

      masterGain.connect(audioCtx.destination);

      // Mix the soundtrack with the existing procedural ambience on the same bus.
      const musicSource = audioCtx.createMediaElementSource(musicTrack);
      const musicGain = audioCtx.createGain();
      musicGain.gain.value = audioMix.music;
      musicSource.connect(musicGain);
      musicGain.connect(masterGain);

      // --- Ambient precipitation: looped band-filtered white noise buffer ---
      const len = audioCtx.sampleRate * 2;
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;

      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 900;
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 7000;
      const rainGain = audioCtx.createGain();
      rainGain.gain.value = audioMix.rain;

      noise.connect(hp);
      hp.connect(lp);
      lp.connect(rainGain);
      rainGain.connect(masterGain);
      noise.start();

      // --- Atmospheric pad: Am9 chord across detuned harmonic oscillators ---
      const padFilter = audioCtx.createBiquadFilter();
      padFilter.type = 'lowpass';
      padFilter.frequency.value = 700;
      padFilter.Q.value = 0.7;
      const padGain = audioCtx.createGain();
      padGain.gain.value = audioMix.synth;
      padFilter.connect(padGain);
      padGain.connect(masterGain);

      [55, 110, 164.81, 220, 261.63, 329.63].forEach((f, i) => {
        [-6, 6].forEach((det) => {
          const o = audioCtx.createOscillator();
          o.type = i < 2 ? 'sine' : 'sawtooth';
          o.frequency.value = f;
          o.detune.value = det;
          o.connect(padFilter);
          o.start();
        });
      });

      // Sub-audible LFO filter cutoff modulation
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.07;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 350;
      lfo.connect(lfoGain);
      lfoGain.connect(padFilter.frequency);
      lfo.start();

      buildAudioExtras();
    }

    function setupAutoHideAudioButton(btn) {
      let timer = null;
      btn.style.transition = 'opacity 0.6s';
      const show = () => {
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        clearTimeout(timer);
        timer = setTimeout(() => {
          btn.style.opacity = '0';
          btn.style.pointerEvents = 'none';
        }, 4000);
      };
      window.addEventListener('pointerdown', show);
      window.addEventListener('pointermove', show);
      window.addEventListener('pointerup', show);
      window.addEventListener('wheel', show, { passive: true });
      window.addEventListener('keydown', show);
      btn.addEventListener('focus', show);
      show();
    }

    const soundBtn = document.createElement('button');
    soundBtn.textContent = '🔇 Audio';
    Object.assign(soundBtn.style, {
      position: 'absolute',
      right: '18px',
      bottom: '18px',
      zIndex: '50',
      padding: '10px 16px',
      font: '600 14px -apple-system, "Segoe UI", sans-serif',
      color: '#cffafe',
      background: 'rgba(11, 6, 29, 0.65)',
      border: '1px solid rgba(0, 243, 255, 0.5)',
      borderRadius: '999px',
      cursor: 'pointer',
      backdropFilter: 'blur(6px)'
    });
    document.body.appendChild(soundBtn);
    setupAutoHideAudioButton(soundBtn);

    soundBtn.addEventListener('click', async () => {
      if (audioTogglePending) return;
      audioTogglePending = true;
      try {
        if (!audioCtx) buildAudio();
        const nextAudioOn = !audioOn;
        if (nextAudioOn) {
          // Start both within the click gesture so browser autoplay rules allow playback.
          await Promise.all([audioCtx.resume(), musicTrack.play()]);
        } else {
          musicTrack.pause();
        }
        audioOn = nextAudioOn;
        masterGain.gain.setTargetAtTime(audioOn ? 0.6 : 0, audioCtx.currentTime, 0.4);
        soundBtn.textContent = audioOn ? '🔊 Audio' : '🔇 Audio';
        soundBtn.setAttribute('aria-pressed', String(audioOn));
      } catch (error) {
        musicTrack.pause();
        console.warn('Could not start audio:', error);
      } finally {
        audioTogglePending = false;
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code !== 'KeyH') return;
      const hide = soundBtn.style.display !== 'none';
      soundBtn.style.display = hide ? 'none' : '';
      fpsBox.style.display = 'none';
      meterOn = false;
    });

    // Suspend audio rendering when tab is backgrounded
    document.addEventListener('visibilitychange', () => {
      if (!audioCtx) return;
      if (document.hidden) {
        musicTrack.pause();
        audioCtx.suspend().catch(console.warn);
      } else if (audioOn) {
        Promise.all([audioCtx.resume(), musicTrack.play()]).catch(console.warn);
      }
    });
  </script>
</body>
</html>
